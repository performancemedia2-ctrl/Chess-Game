<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070a0e;color:#fff;font-family:Inter,Arial,sans-serif}body{padding:16px;background:radial-gradient(circle at 50% -10%,#17202c 0,#090c11 48%,#050608 100%)}button{font:inherit}.app{width:min(1360px,98vw);margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{font-size:26px;font-weight:900;white-space:nowrap}.brand span{font-size:30px;margin-right:8px}.top-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #29323d;background:#10151c;color:#e8edf4;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}.btn:hover:not(:disabled){border-color:#6c7e93;transform:translateY(-1px)}.btn:disabled{cursor:not-allowed;opacity:.45}.btn.green{border-color:#20c95a;color:#5cff89;background:#0d1711;box-shadow:0 0 18px #20c95a22}.layout{display:grid;grid-template-columns:180px minmax(420px,680px) 320px;gap:18px;align-items:start}.side{display:flex;flex-direction:column;gap:14px}.card{background:linear-gradient(145deg,#0e141b,#0a0e13);border:1px solid #202a35;border-radius:13px;padding:14px;box-shadow:0 12px 30px #0006}.player-card{min-height:112px}.player-head{display:flex;justify-content:space-between;align-items:center;color:#dfe6ef;font-size:12px;font-weight:900}.you{color:#35ef73}.computer{color:#ff796f}.clock{font-size:32px;font-weight:950;margin-top:10px;letter-spacing:1px}.clock.red{color:#ff3f49}.clock.green{color:#f1f5f9}.active-card{border-color:#1dd65d;box-shadow:0 0 18px #1dd65d22}.captured-title{font-size:12px;font-weight:900;color:#dfe6ef}.captured-pieces{min-height:28px;margin-top:10px;display:flex;gap:4px;flex-wrap:wrap;font-family:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",serif;font-size:22px}.board-panel{min-width:0}.status{min-height:34px;text-align:center;font-size:18px;font-weight:950;margin:-3px 0 7px}.status.check{color:#ffd33d}.status.mate{color:#ff7373;font-size:22px}.status.win{color:#57f58a;font-size:22px}.board-wrap{width:100%;aspect-ratio:1/1;border:8px solid #2b1a0e;border-radius:13px;overflow:hidden;box-shadow:0 24px 65px #000b,0 0 0 1px #c6894c44;background:#3a2416}.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);overflow:hidden}.sq{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;cursor:pointer;user-select:none}.sq:focus-visible{z-index:4;outline:3px solid #fff;outline-offset:-3px}.light{background:linear-gradient(135deg,#efc982,#d9a861)}.dark{background:linear-gradient(135deg,#9a5f2f,#6f3e20)}.piece{display:block;font-family:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",serif;font-size:clamp(38px,7.2vw,72px);line-height:1;transform:translateY(-1px);text-shadow:0 3px 3px #000b;z-index:2}.white{color:#fff;filter:drop-shadow(0 2px 1px #38200d)}.black{color:#1a2029;filter:drop-shadow(0 2px 1px #ffffff77)}.sq[data-rank]:before,.sq[data-file]:after{position:absolute;z-index:3;font:800 clamp(8px,1.15vw,11px)/1 Inter,Arial,sans-serif;pointer-events:none}.sq[data-rank]:before{content:attr(data-rank);top:4px;left:5px;color:#6a391e}.sq[data-file]:after{content:attr(data-file);right:5px;bottom:4px;color:#f9ddb0}.dark[data-rank]:before{color:#ffe2b3}.light[data-file]:after{color:#754425}.last{box-shadow:inset 0 0 0 999px #e7ad18aa}.selected{box-shadow:inset 0 0 0 4px #20e65e}.move:after{content:"";position:absolute;width:18%;height:18%;border-radius:50%;background:#332113aa}.capture:after{content:"";position:absolute;inset:8%;border:4px solid #e83c36cc;border-radius:50%}.check-king{box-shadow:inset 0 0 0 6px #ff3434,inset 0 0 32px #ff343488;animation:pulse .65s infinite alternate}.mate-king{box-shadow:inset 0 0 0 7px #ff2020,inset 0 0 42px #ff2020dd;animation:pulse .4s infinite alternate}.check-badge{position:absolute;right:5px;top:5px;z-index:5;background:#ef3333;color:#fff;border:2px solid #fff;border-radius:7px;padding:3px 6px;font-size:9px;font-weight:950}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:13px}.controls .btn{background:#eef1f4;color:#14191f;border:0}.controls .btn.green{background:#16c956;color:#031b0a;border:0}.hint{text-align:center;color:#8c99a8;font-size:12px;margin-top:10px}.difficulty-title{font-size:20px;font-weight:950;margin-bottom:13px}.diff{border:1px solid #26313c;border-radius:11px;padding:13px;margin:9px 0;cursor:pointer;display:flex;align-items:center;gap:12px}.diff input{accent-color:#1dd65d;width:18px;height:18px}.diff strong{display:block;font-size:16px}.diff small{color:#8995a4}.diff.easy strong{color:#48ed72}.diff.medium strong{color:#ffd33d}.diff.hard strong{color:#ff515b}.start{width:100%;background:#16c956;color:#031b0a;border:0;border-radius:9px;padding:12px;font-weight:950;cursor:pointer;margin-top:7px}.cancel{width:100%;background:#171d25;color:#fff;border:0;border-radius:9px;padding:11px;font-weight:800;cursor:pointer;margin-top:8px}.modal-backdrop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal-backdrop.show{display:flex}.modal{width:min(520px,94vw);background:linear-gradient(145deg,#101720,#070b10);border:1px solid #354252;border-radius:18px;padding:26px;text-align:center;box-shadow:0 30px 90px #000e;position:relative;overflow:hidden}.modal h2{font-size:30px;margin:4px 0 5px;color:#ffc928}.modal .win{font-size:24px;font-weight:950}.modal p{color:#aab5c3;margin:7px 0 16px}.trophy{font-size:74px;line-height:1;margin:4px 0 10px;filter:drop-shadow(0 0 16px #ffc92866)}.modal-actions{display:flex;gap:10px;justify-content:center}.modal-actions button{flex:1}.firework{position:absolute;width:5px;height:5px;border-radius:50%;animation:burst 1.7s ease-out infinite;opacity:0}.f1{left:12%;top:22%}.f2{right:15%;top:30%;animation-delay:.4s}.f3{left:75%;bottom:16%;animation-delay:.8s}.f4{left:25%;bottom:18%;animation-delay:1.1s}@keyframes burst{0%{opacity:0;box-shadow:0 0 #fff}20%{opacity:1}100%{opacity:0;box-shadow:0 -80px 0 2px #ffcc33,55px -55px 0 2px #ff5b5b,80px 0 0 2px #49d7ff,55px 55px 0 2px #6cff70,0 80px 0 2px #ff7bff,-55px 55px 0 2px #ffcc33,-80px 0 0 2px #49d7ff,-55px -55px 0 2px #ff5b5b}}@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.45)}}@media(max-width:1050px){.layout{grid-template-columns:150px minmax(400px,680px)}.layout>.side:last-child{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}}@media(max-width:720px){body{padding:8px}.topbar{align-items:flex-start;flex-direction:column}.top-actions{justify-content:flex-start}.layout{display:block}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.layout>.side:last-child{display:block}.board-wrap{border-width:4px}.piece{font-size:clamp(34px,10.5vw,58px)}.clock{font-size:25px}.modal-actions{flex-direction:column}}
</style>

<body>
<div class="app">
<header class="topbar"><div class="brand"><span>♟</span>Chess Game</div><div class="top-actions"><button class="btn" id="newGame">New Game</button><button class="btn" id="flip">↔ Flip Board</button><button class="btn" id="undo">↶ Undo</button><button class="btn green" id="ai">🤖 Play vs Computer</button></div></header>
<div class="layout">
<aside class="side">
<div class="card player-card" id="wc"><div class="player-head"><span>♕ WHITE</span><span class="you">● YOU</span></div><div id="wt" class="clock">10:00</div></div>
<div class="card"><div class="captured-title">Captured</div><div id="wcap" class="captured-pieces">—</div></div>
</aside>
<main class="board-panel"><div id="status" class="status">White's turn</div><div class="board-wrap"><div id="board" class="board"></div></div><div class="controls"><button class="btn" id="newGame2">New Game</button><button class="btn" id="flip2">↔ Flip Board</button><button class="btn" id="undo2">↶ Undo</button><button class="btn green" id="ai2">🤖 Play vs Computer</button></div><div class="hint">🔊 Move • Capture • Check • Checkmate sounds are built in</div></main>
<aside class="side">
<div class="card player-card" id="bc"><div class="player-head"><span>♛ BLACK</span><span id="blackLabel" class="computer">COMPUTER</span></div><div id="bt" class="clock red">10:00</div></div>
<div class="card"><div class="captured-title">Captured</div><div id="bcap" class="captured-pieces">—</div></div>
<div class="card" id="difficultyCard" style="display:none"><div class="difficulty-title">🤖 Choose Difficulty</div><label class="diff easy"><input type="radio" name="difficulty" value="1"><span><strong>Easy</strong><small>Perfect for beginners</small></span></label><label class="diff medium"><input type="radio" name="difficulty" value="2" checked><span><strong>Medium</strong><small>Good challenge</small></span></label><label class="diff hard"><input type="radio" name="difficulty" value="3"><span><strong>Hard</strong><small>For experienced players</small></span></label><button class="start" id="startAI">▶ Start Game</button><button class="cancel" id="cancelAI">Cancel</button></div>
</aside>
</div>
</div>
<div class="modal-backdrop" id="winModal"><div class="modal"><i class="firework f1"></i><i class="firework f2"></i><i class="firework f3"></i><i class="firework f4"></i><div class="trophy">🏆</div><h2>CHECKMATE!</h2><div id="winnerText" class="win">You Win!</div><p>Great Game!</p><div class="modal-actions"><button class="start" id="playAgain">↻ Play Again</button><button class="cancel" id="closeWin">⌂ Main Menu</button></div></div></div>
<div class="modal-backdrop" id="promotionModal"><div class="modal"><div class="trophy">♙</div><h2>Promote pawn</h2><p>Choose the piece for your pawn.</p><div class="modal-actions" id="promotionChoices"><button class="start" data-promotion="q">♕ Queen</button><button class="btn" data-promotion="r">♖ Rook</button><button class="btn" data-promotion="b">♗ Bishop</button><button class="btn" data-promotion="n">♘ Knight</button></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);const boardEl=$('board'),statusEl=$('status'),wtEl=$('wt'),btEl=$('bt'),wcEl=$('wc'),bcEl=$('bc'),wcapEl=$('wcap'),bcapEl=$('bcap'),difficultyCard=$('difficultyCard'),winModal=$('winModal'),winnerText=$('winnerText'),promotionModal=$('promotionModal');
const ICON={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};const VALUE={p:100,n:320,b:330,r:500,q:900,k:20000};
let board=[],turn='w',selected=null,flipped=false,gameOver=false,aiMode=false,thinking=false,lastMove=null,captured={w:[],b:[]},time={w:600,b:600},timerId=null,lastTick=0,audio=null,history=[],difficulty=2,castling={wK:true,wQ:true,bK:true,bQ:true},enPassant=null,pendingPromotion=null;
const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8,color=p=>p?p[0]:null,type=p=>p?p[1]:null,clone=x=>x.map(r=>r.slice());
function initialBoard(){return [['br','bn','bb','bq','bk','bb','bn','br'],Array(8).fill('bp'),...Array.from({length:4},()=>Array(8).fill(null)),Array(8).fill('wp'),['wr','wn','wb','wq','wk','wb','wn','wr']].map(r=>r.slice())}
function sound(kind){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const seq={move:[520,700],capture:[180,110],check:[880,660,880],mate:[980,760,540,360],end:[520,390,260]}[kind]||[520,700];seq.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.09;o.type=kind==='capture'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.14)})}catch(e){}}
function specialMove(r,c,special,extra={}){return Object.assign([r,c],{special,...extra})}
function pseudo(r,c){const p=board[r][c],co=color(p),t=type(p),out=[];if(!p)return out;const add=(rr,cc)=>{if(!inside(rr,cc))return false;if(!board[rr][cc]){out.push([rr,cc]);return true}if(color(board[rr][cc])!==co&&type(board[rr][cc])!=='k')out.push([rr,cc]);return false};if(t==='p'){const d=co==='w'?-1:1,st=co==='w'?6:1;if(inside(r+d,c)&&!board[r+d][c]){out.push([r+d,c]);if(r===st&&!board[r+2*d][c])out.push([r+2*d,c])}for(const dc of[-1,1])if(inside(r+d,c+dc)&&board[r+d][c+dc]&&color(board[r+d][c+dc])!==co&&type(board[r+d][c+dc])!=='k')out.push([r+d,c+dc]);if(enPassant&&enPassant.r===r+d&&Math.abs(enPassant.c-c)===1)out.push(specialMove(enPassant.r,enPassant.c,'enPassant',{capture:[enPassant.captureR,enPassant.captureC]}))}if(t==='n')for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+dr,c+dc);if(t==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);const row=co==='w'?7:0,enemy=co==='w'?'b':'w';if(r===row&&c===4&&!attacked(row,4,enemy)){if(castling[co+'K']&&board[row][7]===co+'r'&&!board[row][5]&&!board[row][6]&&!attacked(row,5,enemy)&&!attacked(row,6,enemy))out.push(specialMove(row,6,'castleK'));if(castling[co+'Q']&&board[row][0]===co+'r'&&!board[row][1]&&!board[row][2]&&!board[row][3]&&!attacked(row,3,enemy)&&!attacked(row,2,enemy))out.push(specialMove(row,2,'castleQ'));}}if('brq'.includes(t)){const ds=[];if('bq'.includes(t))ds.push([-1,-1],[-1,1],[1,-1],[1,1]);if('rq'.includes(t))ds.push([-1,0],[1,0],[0,-1],[0,1]);for(const[dr,dc]of ds){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){if(!add(rr,cc))break;rr+=dr;cc+=dc}}}return out}
function attacked(r,c,by){const pr=by==='w'?r+1:r-1;for(const dc of[-1,1])if(inside(pr,c+dc)&&board[pr][c+dc]===by+'p')return true;for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])if(inside(r+dr,c+dc)&&board[r+dr][c+dc]===by+'n')return true;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if((dr||dc)&&inside(r+dr,c+dc)&&board[r+dr][c+dc]===by+'k')return true;for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){const p=board[rr][cc];if(p){if(color(p)===by&&'rq'.includes(type(p)))return true;break}rr+=dr;cc+=dc}}for(const[dr,dc]of[[-1,-1],[-1,1],[1,-1],[1,1]]){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){const p=board[rr][cc];if(p){if(color(p)===by&&'bq'.includes(type(p)))return true;break}rr+=dr;cc+=dc}}return false}
function inCheck(co){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]===co+'k')return attacked(r,c,co==='w'?'b':'w');return true}
function legal(r,c){const p=board[r][c],out=[];if(!p)return out;for(const target of pseudo(r,c)){const [rr,cc]=target,temp=applyTemp({from:[r,c],to:[rr,cc],special:target.special,capture:target.capture});if(!inCheck(color(p)))out.push(target);undoTemp({from:[r,c],to:[rr,cc],special:target.special},temp)}return out}
function allMoves(co){const a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(color(board[r][c])===co)for(const target of legal(r,c)){const[toR,toC]=target;a.push({from:[r,c],to:[toR,toC],special:target.special,captureSquare:target.capture,capture:!!board[toR][toC]||target.special==='enPassant'})}return a}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function stopClock(){if(timerId){clearInterval(timerId);timerId=null}}function updateClocks(){wtEl.textContent=fmt(time.w);btEl.textContent=fmt(time.b);wcEl.querySelector('.clock').classList.toggle('red',time.w<=30&&time.w>0);bcEl.querySelector('.clock').classList.toggle('red',time.b<=30&&time.b>0)}
function saveHistory(){history.push({board:clone(board),turn,time:{...time},captured:{w:[...captured.w],b:[...captured.b]},last:lastMove,gameOver,castling:{...castling},enPassant:enPassant?{...enPassant}:null});if(history.length>80)history.shift()}
function startClock(){if(timerId||gameOver)return;lastTick=Date.now();timerId=setInterval(()=>{const now=Date.now(),e=Math.floor((now-lastTick)/1000);if(!e)return;lastTick+=e*1000;time[turn]=Math.max(0,time[turn]-e);if(time[turn]===0){gameOver=true;stopClock();sound('end');showWinner(turn==='w'?'Black':'White','Time Out')}updateClocks()},250)}
function finishState(){const check=inCheck(turn),moves=allMoves(turn);if(!moves.length)gameOver=true;return{check,moves,mate:gameOver&&check&&!moves.length}}
function updateCastlingRights(p,fr,fc,capturedPiece,tr,tc){const co=color(p);if(type(p)==='k'){castling[co+'K']=false;castling[co+'Q']=false}if(type(p)==='r'&&fr===(co==='w'?7:0)){if(fc===0)castling[co+'Q']=false;if(fc===7)castling[co+'K']=false}if(type(capturedPiece)==='r'){const enemy=color(capturedPiece),row=enemy==='w'?7:0;if(tr===row&&tc===0)castling[enemy+'Q']=false;if(tr===row&&tc===7)castling[enemy+'K']=false}}
function applyTemp(m){const[fr,fc]=m.from,[tr,tc]=m.to,p=board[fr][fc],capture=m.special==='enPassant'?m.captureSquare||m.capture:[tr,tc],capturedPiece=board[capture[0]][capture[1]],record={p,destination:board[tr][tc],capturedPiece,capture,castling:{...castling},enPassant:enPassant?{...enPassant}:null};board[tr][tc]=p;board[fr][fc]=null;if(m.special==='enPassant')board[capture[0]][capture[1]]=null;if(m.special==='castleK'||m.special==='castleQ'){const rookFrom=m.special==='castleK'?7:0,rookTo=m.special==='castleK'?5:3;record.rook={from:rookFrom,to:rookTo,piece:board[fr][rookFrom]};board[fr][rookTo]=board[fr][rookFrom];board[fr][rookFrom]=null}if(type(p)==='p'&&(tr===0||tr===7))board[tr][tc]=color(p)+(m.promotion||'q');updateCastlingRights(p,fr,fc,capturedPiece,tr,tc);enPassant=type(p)==='p'&&Math.abs(tr-fr)===2?{r:(fr+tr)/2,c:fc,captureR:tr,captureC:tc}:null;return record}
function undoTemp(m,record){const[fr,fc]=m.from,[tr,tc]=m.to;board[fr][fc]=record.p;board[tr][tc]=record.destination;if(m.special==='enPassant')board[record.capture[0]][record.capture[1]]=record.capturedPiece;if(record.rook){board[fr][record.rook.from]=record.rook.piece;board[fr][record.rook.to]=null}castling={...record.castling};enPassant=record.enPassant?{...record.enPassant}:null}
function makeMove(fr,fc,tr,tc,meta={},promotion){if(gameOver)return;const p=board[fr][fc],capture=meta.special==='enPassant'?board[meta.capture[0]][meta.capture[1]]:board[tr][tc];saveHistory();if(!timerId)startClock();applyTemp({from:[fr,fc],to:[tr,tc],special:meta.special,captureSquare:meta.capture,promotion});if(capture)captured[color(p)].push(capture);lastMove=[[fr,fc],[tr,tc]];turn=turn==='w'?'b':'w';const st=finishState();sound(capture?'capture':'move');if(st.check&&!gameOver)sound('check');if(st.mate){sound('mate');setTimeout(()=>showWinner(turn==='w'?'Black':'White','Checkmate'),250)}else if(gameOver)stopClock();selected=null;render();if(aiMode&&turn==='b'&&!gameOver)computerMove()}
function clickSquare(r,c){if(gameOver||thinking||pendingPromotion||(aiMode&&turn==='b'))return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}const p=board[r][c];if(!selected){if(color(p)===turn){selected=[r,c];render()}return}const[sr,sc]=selected;if(sr===r&&sc===c){selected=null;render();return}if(color(p)===turn){selected=[r,c];render();return}const target=legal(sr,sc).find(m=>m[0]===r&&m[1]===c);if(target){if(type(board[sr][sc])==='p'&&(r===0||r===7)){pendingPromotion={fr:sr,fc:sc,tr:r,tc:c,meta:{special:target.special,capture:target.capture}};promotionModal.classList.add('show');return}makeMove(sr,sc,r,c,{special:target.special,capture:target.capture})}}
function evaluate(){let score=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=board[r][c];if(!p)continue;const v=VALUE[type(p)];score+=(color(p)==='b'?-v:v)}if(inCheck('w'))score-=35;if(inCheck('b'))score+=35;return score}
function minimax(depth,alpha,beta,maximizing){const side=maximizing?'b':'w',moves=allMoves(side);if(!moves.length){if(inCheck(side))return maximizing?-999999-depth:999999+depth;return 0}if(depth===0)return evaluate();if(maximizing){let best=-Infinity;for(const m of moves){const q=applyTemp(m),v=minimax(depth-1,alpha,beta,false);undoTemp(m,q);best=Math.max(best,v);alpha=Math.max(alpha,v);if(beta<=alpha)break}return best}else{let best=Infinity;for(const m of moves){const q=applyTemp(m),v=minimax(depth-1,alpha,beta,true);undoTemp(m,q);best=Math.min(best,v);beta=Math.min(beta,v);if(beta<=alpha)break}return best}}
function computerMove(){if(!aiMode||turn!=='b'||gameOver||thinking)return;thinking=true;render();setTimeout(()=>{const moves=allMoves('b');if(!moves.length){thinking=false;render();return}if(difficulty===1){const m=moves[Math.floor(Math.random()*moves.length)];thinking=false;makeMove(m.from[0],m.from[1],m.to[0],m.to[1]);return}const depth=difficulty===3?3:2;let best=-Infinity,bestMoves=[];for(const m of moves){const q=applyTemp(m),score=minimax(depth-1,-Infinity,Infinity,false);undoTemp(m,q);if(score>best){best=score;bestMoves=[m]}else if(score===best)bestMoves.push(m)}const m=bestMoves[Math.floor(Math.random()*bestMoves.length)];thinking=false;makeMove(m.from[0],m.from[1],m.to[0],m.to[1])},difficulty===3?500:300)}
function renderCaptured(){wcapEl.textContent=captured.w.length?captured.w.map(p=>ICON[color(p)][type(p)]).join(' '):'—';bcapEl.textContent=captured.b.length?captured.b.map(p=>ICON[color(p)][type(p)]).join(' '):'—'}
function render(){const st=finishState(),check=st.check,mate=st.mate;statusEl.className='status';if(gameOver){if(time[turn]===0){statusEl.textContent='⏱️ Time Out!';statusEl.classList.add('mate')}else if(mate){statusEl.textContent='♛ CHECKMATE! 🏆 '+(turn==='w'?'Black':'White')+' wins!';statusEl.classList.add('mate')}else if(!st.moves.length){statusEl.textContent='½ Draw — no legal moves.'}}else{statusEl.textContent=thinking?'🤖 Computer is thinking...':(turn==='w'?'White':'Black')+"'s turn"+(check?' — ⚠ CHECK!':'')+(aiMode?' — You are White':'');if(check)statusEl.classList.add('check')}boardEl.innerHTML='';for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const r=flipped?7-vr:vr,c=flipped?7-vc:vc,s=document.createElement('button');s.type='button';s.className='sq '+((r+c)%2?'dark':'light');s.setAttribute('aria-label',`${String.fromCharCode(97+c)}${8-r}${board[r][c]?` ${color(board[r][c])==='w'?'white':'black'} ${type(board[r][c])}`:''}`);if(vc===0)s.dataset.rank=8-r;if(vr===7)s.dataset.file=String.fromCharCode(97+c);if(lastMove&&((lastMove[0][0]===r&&lastMove[0][1]===c)||(lastMove[1][0]===r&&lastMove[1][1]===c)))s.classList.add('last');const king=check&&board[r][c]===turn+'k';if(king)s.classList.add(mate?'mate-king':'check-king');if(selected&&selected[0]===r&&selected[1]===c)s.classList.add('selected');if(!gameOver&&selected&&legal(selected[0],selected[1]).some(m=>m[0]===r&&m[1]===c))s.classList.add(board[r][c]?'capture':'move');const p=board[r][c];if(p){const z=document.createElement('span');z.className='piece '+(color(p)==='w'?'white':'black');z.textContent=ICON[color(p)][type(p)];s.appendChild(z);if(king){const b=document.createElement('span');b.className='check-badge';b.textContent=mate?'CHECKMATE':'CHECK';s.appendChild(b)}}s.addEventListener('click',()=>clickSquare(r,c));boardEl.appendChild(s)}wtEl.textContent=fmt(time.w);btEl.textContent=fmt(time.b);wcEl.classList.toggle('active-card',!gameOver&&turn==='w');bcEl.classList.toggle('active-card',!gameOver&&turn==='b');wcEl.querySelector('.clock').classList.toggle('red',time.w<=30&&time.w>0);bcEl.querySelector('.clock').classList.toggle('red',time.b<=30&&time.b>0);renderCaptured();$('undo').disabled=history.length===0||thinking;$('undo2').disabled=history.length===0||thinking}
function showWinner(who,reason){winnerText.textContent=who==='White'?'You Win!':'Black Wins!';winModal.classList.add('show');statusEl.textContent=reason==='Checkmate'?'♛ CHECKMATE! 🏆 '+who+' wins!':'🏆 '+who+' wins!';statusEl.className='status win';stopClock()}
function hideWinner(){winModal.classList.remove('show')}
function newGame(){stopClock();hideWinner();promotionModal.classList.remove('show');board=initialBoard();turn='w';selected=null;gameOver=false;thinking=false;lastMove=null;captured={w:[],b:[]};time={w:600,b:600};history=[];castling={wK:true,wQ:true,bK:true,bQ:true};enPassant=null;pendingPromotion=null;render()}
function toggleAI(){if(aiMode){aiMode=false;newGame();$('ai').textContent='🤖 Play vs Computer';$('ai2').textContent='🤖 Play vs Computer';$('blackLabel').textContent='BLACK';return}difficultyCard.style.display='block'}
function startAI(){aiMode=true;difficulty=Number(document.querySelector('input[name=difficulty]:checked').value);difficultyCard.style.display='none';$('ai').textContent='🤖 Computer ON';$('ai2').textContent='🤖 Computer ON';$('blackLabel').textContent='COMPUTER • '+(['','EASY','MEDIUM','HARD'][difficulty]);newGame()}
function restoreHistory(h){board=clone(h.board);turn=h.turn;time={...h.time};captured={w:[...h.captured.w],b:[...h.captured.b]};lastMove=h.last;gameOver=h.gameOver;castling={...h.castling};enPassant=h.enPassant?{...h.enPassant}:null}
function undo(){if(!history.length||thinking||pendingPromotion)return;restoreHistory(history.pop());selected=null;if(aiMode&&turn==='b'&&history.length)restoreHistory(history.pop());stopClock();if(!gameOver)startClock();render()}
['newGame','newGame2'].forEach(id=>$(id).onclick=newGame);['flip','flip2'].forEach(id=>$(id).onclick=()=>{flipped=!flipped;render()});['undo','undo2'].forEach(id=>$(id).onclick=undo);['ai','ai2'].forEach(id=>$(id).onclick=toggleAI);$('startAI').onclick=startAI;$('cancelAI').onclick=()=>difficultyCard.style.display='none';$('playAgain').onclick=newGame;$('closeWin').onclick=hideWinner;document.querySelectorAll('[data-promotion]').forEach(button=>button.onclick=()=>{if(!pendingPromotion)return;const move=pendingPromotion;pendingPromotion=null;promotionModal.classList.remove('show');makeMove(move.fr,move.fc,move.tr,move.tc,move.meta,button.dataset.promotion)});newGame();
</script>
</body></html>
