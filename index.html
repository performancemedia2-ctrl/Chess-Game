<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#334155,#080b11 68%);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:18px}.app{width:min(96vw,720px);text-align:center}h1{margin:4px 0;font-size:clamp(30px,6vw,42px)}.sub{color:#94a3b8;font-size:13px;margin-bottom:4px}.status{font-weight:800;min-height:28px}.timers,.captured{display:flex;gap:10px;justify-content:center;margin:8px auto;width:min(94vw,590px)}.clock,.cap{flex:1;background:#111827;border:2px solid #334155;border-radius:12px;padding:8px}.clock.active{border-color:#22c55e;box-shadow:0 0 12px #22c55e44}.clock.low{border-color:#ef4444}.name,.cap b{font-size:11px;color:#94a3b8}.time{font-size:28px;font-weight:900}.cap{text-align:left;min-height:42px}.caps{font-size:20px;margin-left:6px}.wrap{width:min(94vw,590px);margin:auto;padding:9px;background:linear-gradient(145deg,#654b36,#20150e);border-radius:15px;box-shadow:0 15px 45px #0008}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;border-radius:8px}.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;user-select:none}.light{background:#ead7b5}.dark{background:#a66e42}.piece{font-size:clamp(34px,8.5vw,66px);line-height:1;text-shadow:0 3px 3px #0009;z-index:2}.white{color:#fff}.black{color:#151515}.selected{box-shadow:inset 0 0 0 5px #22c55e}.move:after{content:"";position:absolute;width:20%;height:20%;border-radius:50%;background:#16a34acc}.capture:after{content:"";position:absolute;inset:8%;border:5px solid #ef4444cc;border-radius:50%}.last{box-shadow:inset 0 0 0 999px #facc1540}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}button{padding:11px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#f8fafc;color:#111827}button.active{background:#22c55e;color:#052e16}.hint{color:#94a3b8;font-size:12px;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<h1>♟ Chess Game</h1>
<div class="sub">Classic board • Legal moves • Smart Computer</div>
<div id="status" class="status">White's turn</div>
<div class="timers"><div id="wc" class="clock active"><div class="name">♔ WHITE</div><div id="wt" class="time">10:00</div></div><div id="bc" class="clock"><div class="name">♚ BLACK</div><div id="bt" class="time">10:00</div></div></div>
<div class="captured"><div class="cap"><b>WHITE CAPTURED</b><span id="wcap" class="caps">—</span></div><div class="cap"><b>BLACK CAPTURED</b><span id="bcap" class="caps">—</span></div></div>
<div class="wrap"><div id="board" class="board"></div></div>
<div class="controls"><button id="newGame">New Game</button><button id="flip">↔ Flip Board</button><button id="undo">↩ Undo</button><button id="ai">🤖 Play vs Computer</button></div>
<div class="hint">🔊 Move • Capture • Check sounds are built in</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const boardEl=$('board'),statusEl=$('status'),wtEl=$('wt'),btEl=$('bt'),wcEl=$('wc'),bcEl=$('bc'),wcapEl=$('wcap'),bcapEl=$('bcap');
const newGameBtn=$('newGame'),flipBtn=$('flip'),undoBtn=$('undo'),aiBtn=$('ai');
const ICON={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
let board=[],turn='w',selected=null,flipped=false,gameOver=false,aiMode=false,thinking=false,lastMove=null,captured={w:[],b:[]},time={w:600,b:600},timerId=null,lastTick=0,audio=null,history=[];
const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const color=p=>p?p[0]:null, type=p=>p?p[1]:null;
function initialBoard(){return [['br','bn','bb','bq','bk','bb','bn','br'],Array(8).fill('bp'),...Array.from({length:4},()=>Array(8).fill(null)),Array(8).fill('wp'),['wr','wn','wb','wq','wk','wb','wn','wr']].map(r=>r.slice());}
function clone(x){return x.map(r=>r.slice())}
function sound(kind){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const sets={move:[[520,.08],[700,.06]],capture:[[180,.12],[110,.14]],check:[[880,.1],[660,.14]],end:[[520,.1],[390,.1],[260,.2]]};(sets[kind]||sets.move).forEach((a,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.07;o.type=kind==='capture'?'sawtooth':'triangle';o.frequency.value=a[0];g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.045,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+a[1]);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+a[1]+.02)})}catch(e){}}
function pseudo(r,c){const p=board[r][c],co=color(p),t=type(p),out=[];if(!p)return out;const add=(rr,cc)=>{if(!inside(rr,cc))return false;if(!board[rr][cc]){out.push([rr,cc]);return true}if(color(board[rr][cc])!==co)out.push([rr,cc]);return false};
if(t==='p'){const d=co==='w'?-1:1,start=co==='w'?6:1;if(inside(r+d,c)&&!board[r+d][c]){out.push([r+d,c]);if(r===start&&!board[r+2*d][c])out.push([r+2*d,c])}for(const dc of[-1,1])if(inside(r+d,c+dc)&&board[r+d][c+dc]&&color(board[r+d][c+dc])!==co)out.push([r+d,c+dc])}
if(t==='n')for(const [dr,dc] of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+dr,c+dc);
if(t==='k')for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);
if('brq'.includes(t)){const dirs=[];if('bq'.includes(t))dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);if('rq'.includes(t))dirs.push([-1,0],[1,0],[0,-1],[0,1]);for(const [dr,dc] of dirs){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){if(!add(rr,cc))break;rr+=dr;cc+=dc}}}
return out;}
function attacked(r,c,by){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++)if(color(board[rr][cc])===by){const p=board[rr][cc];if(type(p)==='p'){const d=by==='w'?-1:1;if(r===rr+d&&Math.abs(c-cc)===1)return true}else if(type(p)==='k'){if(Math.max(Math.abs(r-rr),Math.abs(c-cc))===1)return true}else if(pseudo(rr,cc).some(m=>m[0]===r&&m[1]===c))return true}return false;}
function inCheck(co){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]===co+'k')return attacked(r,c,co==='w'?'b':'w');return true;}
function legal(r,c){const p=board[r][c],out=[];if(!p)return out;for(const [rr,cc] of pseudo(r,c)){const capturedPiece=board[rr][cc];if(capturedPiece&&type(capturedPiece)==='k')continue;board[rr][cc]=p;board[r][c]=null;if(!inCheck(color(p)))out.push([rr,cc]);board[r][c]=p;board[rr][cc]=capturedPiece}return out;}
function allMoves(co){const out=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(color(board[r][c])===co)for(const [rr,cc] of legal(r,c))out.push({from:[r,c],to:[rr,cc]});return out;}
function fmt(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function saveHistory(){history.push({board:clone(board),turn,time:{...time},captured:{w:[...captured.w],b:[...captured.b]},last:lastMove,gameOver,thinking:false});if(history.length>80)history.shift();}
function startClock(){if(timerId||gameOver)return;lastTick=Date.now();timerId=setInterval(()=>{const now=Date.now(),elapsed=Math.floor((now-lastTick)/1000);if(!elapsed)return;lastTick+=elapsed*1000;time[turn]=Math.max(0,time[turn]-elapsed);if(time[turn]===0){gameOver=true;clearInterval(timerId);timerId=null;sound('end')}render()},250)}
function makeMove(fr,fc,tr,tc){saveHistory();if(!timerId)startClock();const p=board[fr][fc],q=board[tr][tc];if(q)captured[color(p)].push(q);board[tr][tc]=p;board[fr][fc]=null;if(type(p)==='p'&&(tr===0||tr===7))board[tr][tc]=color(p)+'q';lastMove=[[fr,fc],[tr,tc]];turn=turn==='w'?'b':'w';const check=inCheck(turn),moves=allMoves(turn);if(!moves.length)gameOver=true;sound(q?'capture':'move');if(check&&!gameOver)sound('check');if(gameOver)sound('end');selected=null;render()}
function clickSquare(r,c){if(gameOver||thinking||(aiMode&&turn==='b'))return;if(!timerId)startClock();try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}const p=board[r][c];if(!selected){if(color(p)===turn){selected=[r,c];render()}return}const [sr,sc]=selected;if(sr===r&&sc===c){selected=null;render();return}if(color(p)===turn){selected=[r,c];render();return}if(legal(sr,sc).some(m=>m[0]===r&&m[1]===c)){makeMove(sr,sc,r,c);if(aiMode&&!gameOver&&turn==='b')setTimeout(computerMove,300)}}
function computerMove(){if(!aiMode||turn!=='b'||gameOver)return;thinking=true;render();setTimeout(()=>{const moves=allMoves('b');if(!moves.length){gameOver=true;thinking=false;render();return}const captures=moves.filter(m=>board[m.to[0]][m.to[1]]);const pool=captures.length?captures:moves;const m=pool[Math.floor(Math.random()*pool.length)];thinking=false;makeMove(m.from[0],m.from[1],m.to[0],m.to[1])},350)}
function renderCaptured(){wcapEl.textContent=captured.w.length?captured.w.map(p=>ICON[color(p)][type(p)]).join(' '):'—';bcapEl.textContent=captured.b.length?captured.b.map(p=>ICON[color(p)][type(p)]).join(' '):'—'}
function render(){const check=inCheck(turn),moves=allMoves(turn);if(gameOver){if(time[turn]===0)statusEl.textContent='⏱️ Time out! '+(turn==='w'?'Black':'White')+' wins.';else if(!moves.length)statusEl.textContent=check?'♛ Checkmate! '+(turn==='w'?'Black':'White')+' wins.':'½ Draw — no legal moves.'}else statusEl.textContent=thinking?'🤖 Computer is thinking...':(turn==='w'?'White':'Black')+"'s turn"+(check?' — CHECK!':'')+(aiMode?' — You are White':'');boardEl.innerHTML='';for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const r=flipped?7-vr:vr,c=flipped?7-vc:vc,s=document.createElement('div');s.className='sq '+((r+c)%2?'dark':'light');if(lastMove&&((lastMove[0][0]===r&&lastMove[0][1]===c)||(lastMove[1][0]===r&&lastMove[1][1]===c)))s.classList.add('last');if(selected&&selected[0]===r&&selected[1]===c)s.classList.add('selected');if(selected&&legal(selected[0],selected[1]).some(m=>m[0]===r&&m[1]===c))s.classList.add(board[r][c]?'capture':'move');const p=board[r][c];if(p){const z=document.createElement('span');z.className='piece '+(color(p)==='w'?'white':'black');z.textContent=ICON[color(p)][type(p)];s.appendChild(z)}s.addEventListener('click',()=>clickSquare(r,c));boardEl.appendChild(s)}wtEl.textContent=fmt(time.w);btEl.textContent=fmt(time.b);wcEl.classList.toggle('active',!gameOver&&turn==='w');bcEl.classList.toggle('active',!gameOver&&turn==='b');wcEl.classList.toggle('low',time.w<=30&&time.w>0);bcEl.classList.toggle('low',time.b<=30&&time.b>0);renderCaptured();undoBtn.disabled=history.length===0||thinking;aiBtn.classList.toggle('active',aiMode)}
function newGame(){if(timerId){clearInterval(timerId);timerId=null}board=initialBoard();turn='w';selected=null;gameOver=false;thinking=false;lastMove=null;captured={w:[],b:[]};time={w:600,b:600};history=[];render()}
newGameBtn.addEventListener('click',newGame);flipBtn.addEventListener('click',()=>{flipped=!flipped;render()});undoBtn.addEventListener('click',()=>{if(!history.length||thinking)return;const h=history.pop();board=clone(h.board);turn=h.turn;time={...h.time};captured={w:[...h.captured.w],b:[...h.captured.b]};lastMove=h.last;gameOver=h.gameOver;selected=null;if(timerId){clearInterval(timerId);timerId=null}if(h.turn==='w'&&!aiMode)startClock();render()});aiBtn.addEventListener('click',()=>{aiMode=!aiMode;newGame()});
newGame();
</script>
</body>
</html>
