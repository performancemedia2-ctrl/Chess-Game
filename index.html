<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#243b53 0%,#101827 45%,#05070b 100%);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:14px}
.app{width:min(98vw,860px);text-align:center}
h1{margin:2px 0;font-size:clamp(30px,5vw,42px)}
.sub{color:#aab7c7;font-size:13px;margin-bottom:3px}
.status{font-weight:900;min-height:34px;font-size:18px}
.status.check{color:#ffd84d;text-shadow:0 0 12px #ffd84d88}.status.mate{color:#ff6b6b;font-size:23px;text-shadow:0 0 16px #ff303088}.status.winner{color:#4ade80;font-size:21px}
.timers,.captured{display:flex;gap:10px;justify-content:center;margin:7px auto;width:min(96vw,700px)}
.clock,.cap{flex:1;background:linear-gradient(145deg,#172235,#0d1420);border:2px solid #34445c;border-radius:13px;padding:8px}
.clock.active{border-color:#22c55e;box-shadow:0 0 16px #22c55e44}.clock.low{border-color:#ef4444;box-shadow:0 0 16px #ef444433}
.name,.cap b{font-size:11px;color:#aebbd0}.time{font-size:29px;font-weight:900}.cap{text-align:left;min-height:44px}.caps{font-size:21px;margin-left:6px}
/* Bigger, stable chess.com-style board */
.wrap{width:min(96vw,700px);margin:10px auto 0;padding:10px;background:linear-gradient(145deg,#8b5a32,#3b2415 55%,#1d120b);border:1px solid #b98a5a;border-radius:16px;box-shadow:0 20px 55px #000b,0 0 0 3px #1b120c}
.board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);overflow:hidden;border-radius:8px;box-shadow:inset 0 0 0 2px #3d2415}
.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;user-select:none;min-width:0;min-height:0}
.light{background:linear-gradient(135deg,#f0d9b5 0%,#dfc097 100%)}
.dark{background:linear-gradient(135deg,#b58863 0%,#8f5f3d 100%)}
.piece{font-size:clamp(42px,9vw,78px);line-height:1;text-shadow:0 3px 3px #0009;z-index:2;transform:translateY(-1px)}
.white{color:#fff}.black{color:#171717}
.selected{box-shadow:inset 0 0 0 5px #22c55e, inset 0 0 22px #22c55e55}
.move:after{content:"";position:absolute;width:19%;height:19%;border-radius:50%;background:#16803acc;z-index:1}
.capture:after{content:"";position:absolute;inset:7%;border:5px solid #ef4444cc;border-radius:50%;z-index:1}
.last{box-shadow:inset 0 0 0 999px #facc1545}
.check-king{box-shadow:inset 0 0 0 7px #ef4444,inset 0 0 32px #ef444488;animation:checkPulse .75s infinite alternate}
.mate-king{box-shadow:inset 0 0 0 8px #dc2626,inset 0 0 42px #dc2626cc;animation:matePulse .5s infinite alternate}
.check-badge{position:absolute;top:5px;right:5px;z-index:5;background:#dc2626;color:#fff;border:2px solid #fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;box-shadow:0 0 14px #dc2626}
.mate-badge{width:auto;height:auto;border-radius:8px;padding:4px 6px;font-size:10px;top:5px;right:5px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}
button{padding:11px 17px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#f8fafc;color:#111827}button.active{background:#22c55e;color:#052e16}button:disabled{opacity:.45;cursor:not-allowed}.hint{color:#94a3b8;font-size:12px;margin-top:12px}
@keyframes checkPulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}@keyframes matePulse{from{filter:brightness(1)}to{filter:brightness(1.6)}}
@media(max-width:520px){body{padding:8px}.app{width:100%}.timers,.captured{width:98vw;gap:6px}.wrap{width:98vw;padding:7px;border-radius:12px}.piece{font-size:clamp(34px,11vw,58px)}.time{font-size:24px}.controls{gap:7px}.controls button{padding:10px 12px}}
</style>
</head>
<body>
<div class="app">
<h1>♟ Chess Game</h1>
<div class="sub">Classic board • Legal moves • Smart Computer</div>
<div id="status" class="status">White's turn</div>
<div class="timers"><div id="wc" class="clock active"><div class="name">♔ WHITE</div><div id="wt" class="time">10:00</div></div><div id="bc" class="clock"><div class="name">♚ BLACK</div><div id="bt" class="time">10:00</div></div></div>
<div class="captured"><div class="cap"><b>WHITE CAPTURED</b><span id="wcap" class="caps">—</span></div><div class="cap"><b>BLACK CAPTURED</b><span id="bcap" class="caps">—</span></div></div>
<div class="wrap"><div id="board" class="board"></div></div>
<div class="controls"><button id="newGame">New Game</button><button id="flip">↔ Flip Board</button><button id="undo">↩ Undo</button><button id="ai">🤖 Play vs Computer</button></div>
<div class="hint">🔊 Move • Capture • Check • Checkmate sounds are built in</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const boardEl=$('board'),statusEl=$('status'),wtEl=$('wt'),btEl=$('bt'),wcEl=$('wc'),bcEl=$('bc'),wcapEl=$('wcap'),bcapEl=$('bcap'),newGameBtn=$('newGame'),flipBtn=$('flip'),undoBtn=$('undo'),aiBtn=$('ai');
const ICON={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
let board=[],turn='w',selected=null,flipped=false,gameOver=false,aiMode=false,thinking=false,lastMove=null,captured={w:[],b:[]},time={w:600,b:600},timerId=null,lastTick=0,audio=null,history=[];
const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const color=p=>p?p[0]:null;
const type=p=>p?p[1]:null;
function initialBoard(){return [['br','bn','bb','bq','bk','bb','bn','br'],Array(8).fill('bp'),...Array.from({length:4},()=>Array(8).fill(null)),Array(8).fill('wp'),['wr','wn','wb','wq','wk','wb','wn','wr']].map(r=>r.slice())}
function clone(x){return x.map(r=>r.slice())}
function sound(kind){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const sets={move:[[520,.08],[700,.06]],capture:[[180,.12],[110,.14]],check:[[880,.1],[660,.14],[880,.1]],mate:[[980,.12],[760,.12],[540,.18],[360,.25]],end:[[520,.1],[390,.1],[260,.2]]};(sets[kind]||sets.move).forEach((a,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.09;o.type=kind==='capture'?'sawtooth':'triangle';o.frequency.value=a[0];g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.055,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+a[1]);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+a[1]+.02)})}catch(e){}}
function pseudo(r,c){const p=board[r][c],co=color(p),t=type(p),out=[];if(!p)return out;const add=(rr,cc)=>{if(!inside(rr,cc))return false;if(!board[rr][cc]){out.push([rr,cc]);return true}if(color(board[rr][cc])!==co&&type(board[rr][cc])!=='k')out.push([rr,cc]);return false};
if(t==='p'){const d=co==='w'?-1:1,start=co==='w'?6:1;if(inside(r+d,c)&&!board[r+d][c]){out.push([r+d,c]);if(r===start&&!board[r+2*d][c])out.push([r+2*d,c])}for(const dc of[-1,1])if(inside(r+d,c+dc)&&board[r+d][c+dc]&&color(board[r+d][c+dc])!==co&&type(board[r+d][c+dc])!=='k')out.push([r+d,c+dc])}
if(t==='n')for(const [dr,dc] of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+dr,c+dc);
if(t==='k')for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);
if('brq'.includes(t)){const dirs=[];if('bq'.includes(t))dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);if('rq'.includes(t))dirs.push([-1,0],[1,0],[0,-1],[0,1]);for(const [dr,dc] of dirs){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){if(!add(rr,cc))break;rr+=dr;cc+=dc}}}
return out}
function squareAttacked(r,c,by){
const pawnRow=by==='w'?r+1:r-1;
for(const dc of[-1,1])if(inside(pawnRow,c+dc)&&board[pawnRow][c+dc]===by+'p')return true;
const knightDirs=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];for(const [dr,dc] of knightDirs)if(inside(r+dr,c+dc)&&board[r+dr][c+dc]===by+'n')return true;
for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if((dr||dc)&&inside(r+dr,c+dc)&&board[r+dr][c+dc]===by+'k')return true;
for(const [dr,dc] of[[-1,0],[1,0],[0,-1],[0,1]]){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){const p=board[rr][cc];if(p){if(color(p)===by&&('rq'.includes(type(p))))return true;break}rr+=dr;cc+=dc}}
for(const [dr,dc] of[[-1,-1],[-1,1],[1,-1],[1,1]]){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){const p=board[rr][cc];if(p){if(color(p)===by&&('bq'.includes(type(p))))return true;break}rr+=dr;cc+=dc}}
return false}
function inCheck(co){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]===co+'k')return squareAttacked(r,c,co==='w'?'b':'w');return true}
function legal(r,c){const p=board[r][c],out=[];if(!p)return out;for(const [rr,cc] of pseudo(r,c)){const capturedPiece=board[rr][cc];board[rr][cc]=p;board[r][c]=null;if(!inCheck(color(p)))out.push([rr,cc]);board[r][c]=p;board[rr][cc]=capturedPiece}return out}
function allMoves(co){const out=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(color(board[r][c])===co)for(const [rr,cc] of legal(r,c))out.push({from:[r,c],to:[rr,cc]});return out}
function fmt(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function stopClock(){if(timerId){clearInterval(timerId);timerId=null}}
function saveHistory(){history.push({board:clone(board),turn,time:{...time},captured:{w:[...captured.w],b:[...captured.b]},last:lastMove,gameOver});if(history.length>80)history.shift()}
function startClock(){if(timerId||gameOver)return;lastTick=Date.now();timerId=setInterval(()=>{const now=Date.now(),elapsed=Math.floor((now-lastTick)/1000);if(!elapsed)return;lastTick+=elapsed*1000;time[turn]=Math.max(0,time[turn]-elapsed);if(time[turn]===0){gameOver=true;stopClock();sound('end')}render()},250)}
function makeMove(fr,fc,tr,tc){if(gameOver)return;saveHistory();if(!timerId)startClock();const p=board[fr][fc],q=board[tr][tc];if(q)captured[color(p)].push(q);board[tr][tc]=p;board[fr][fc]=null;if(type(p)==='p'&&(tr===0||tr===7))board[tr][tc]=color(p)+'q';lastMove=[[fr,fc],[tr,tc]];turn=turn==='w'?'b':'w';const check=inCheck(turn),moves=allMoves(turn);if(!moves.length)gameOver=true;sound(q?'capture':'move');if(check&&!gameOver)sound('check');if(gameOver&&check)sound('mate');selected=null;render();if(aiMode&&turn==='b'&&!gameOver)computerMove()}
function clickSquare(r,c){if(gameOver||thinking||(aiMode&&turn==='b'))return;if(!timerId)startClock();try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}const p=board[r][c];if(!selected){if(color(p)===turn){selected=[r,c];render()}return}const[sr,sc]=selected;if(sr===r&&sc===c){selected=null;render();return}if(color(p)===turn){selected=[r,c];render();return}if(legal(sr,sc).some(m=>m[0]===r&&m[1]===c))makeMove(sr,sc,r,c)}
function computerMove(){if(!aiMode||turn!=='b'||gameOver||thinking)return;thinking=true;render();setTimeout(()=>{const moves=allMoves('b');if(!moves.length){thinking=false;render();return}const captures=moves.filter(m=>board[m.to[0]][m.to[1]]);const pool=captures.length?captures:moves;const m=pool[Math.floor(Math.random()*pool.length)];thinking=false;makeMove(m.from[0],m.from[1],m.to[0],m.to[1])},350)}
function renderCaptured(){wcapEl.textContent=captured.w.length?captured.w.map(p=>ICON[color(p)][type(p)]).join(' '):'—';bcapEl.textContent=captured.b.length?captured.b.map(p=>ICON[color(p)][type(p)].join(' '):'—'}
function render(){const check=inCheck(turn),moves=allMoves(turn),mate=gameOver&&check&&!moves.length;statusEl.className='status';if(gameOver){if(time[turn]===0){statusEl.textContent='⏱️ Time out! 🏆 '+(turn==='w'?'Black':'White')+' wins.';statusEl.classList.add('winner')}else if(mate){statusEl.textContent='♛ CHECKMATE! 🏆 '+(turn==='w'?'Black':'White')+' wins!';statusEl.classList.add('mate')}else if(!moves.length){statusEl.textContent='½ Draw — no legal moves.'}}else{statusEl.textContent=thinking?'🤖 Computer is thinking...':(turn==='w'?'White':'Black')+"'s turn"+(check?' — ⚠ CHECK!':'')+(aiMode?' — You are White':'');if(check)statusEl.classList.add('check')}
boardEl.innerHTML='';for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const r=flipped?7-vr:vr,c=flipped?7-vc:vc,s=document.createElement('div');s.className='sq '+((r+c)%2?'dark':'light');if(lastMove&&((lastMove[0][0]===r&&lastMove[0][1]===c)||(lastMove[1][0]===r&&lastMove[1][1]===c)))s.classList.add('last');const kingIsChecked=check&&board[r][c]===turn+'k';if(kingIsChecked)s.classList.add(mate?'mate-king':'check-king');if(selected&&selected[0]===r&&selected[1]===c)s.classList.add('selected');if(!gameOver&&selected&&legal(selected[0],selected[1]).some(m=>m[0]===r&&m[1]===c))s.classList.add(board[r][c]?'capture':'move');const p=board[r][c];if(p){const z=document.createElement('span');z.className='piece '+(color(p)==='w'?'white':'black');z.textContent=ICON[color(p)][type(p)];s.appendChild(z);if(kingIsChecked){const badge=document.createElement('span');badge.className='check-badge'+(mate?' mate-badge':'');badge.textContent=mate?'MATE':'⚠';s.appendChild(badge)}}s.addEventListener('click',()=>clickSquare(r,c));boardEl.appendChild(s)}wtEl.textContent=fmt(time.w);btEl.textContent=fmt(time.b);wcEl.classList.toggle('active',!gameOver&&turn==='w');bcEl.classList.toggle('active',!gameOver&&turn==='b');wcEl.classList.toggle('low',time.w<=30&&time.w>0);bcEl.classList.toggle('low',time.b<=30&&time.b>0);renderCaptured();undoBtn.disabled=history.length===0||thinking;aiBtn.classList.toggle('active',aiMode)}
function newGame(){stopClock();board=initialBoard();turn='w';selected=null;gameOver=false;thinking=false;lastMove=null;captured={w:[],b:[]};time={w:600,b:600};history=[];render()}
newGameBtn.addEventListener('click',newGame);flipBtn.addEventListener('click',()=>{flipped=!flipped;render()});undoBtn.addEventListener('click',()=>{if(!history.length||thinking)return;const h=history.pop();board=clone(h.board);turn=h.turn;time={...h.time};captured={w:[...h.captured.w],b:[...h.captured.b]};lastMove=h.last;gameOver=h.gameOver;selected=null;stopClock();if(!gameOver)startClock();render()});aiBtn.addEventListener('click',()=>{aiMode=!aiMode;newGame();aiBtn.classList.toggle('active',aiMode)});newGame();
</script>
</body>
</html>
