<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#243b53 0,#101827 45%,#05070b 100%);color:#fff;font-family:Arial,sans-serif}body{display:flex;justify-content:center;padding:18px}.app{width:min(96vw,900px);text-align:center}h1{margin:2px 0 4px;font-size:clamp(30px,5vw,42px)}.sub{color:#aab7c7;font-size:13px;margin-bottom:4px}.status{min-height:34px;font-size:18px;font-weight:900}.status.check{color:#ffd84d}.status.mate{color:#ff6b6b;font-size:23px}.status.winner{color:#4ade80;font-size:21px}.timers,.captured{width:min(94vw,760px);margin:7px auto;display:flex;gap:10px}.clock,.cap{flex:1;min-width:0;background:#111827;border:2px solid #334155;border-radius:12px;padding:8px}.clock.active{border-color:#22c55e;box-shadow:0 0 14px #22c55e44}.clock.low{border-color:#ef4444}.name,.cap b{font-size:11px;color:#aebbd0}.time{font-size:29px;font-weight:900}.cap{height:48px;text-align:left;overflow:hidden}.caps{display:block;font-size:20px;white-space:nowrap;overflow:hidden;margin-top:2px}.board-wrap{width:min(94vw,760px);height:min(94vw,760px);margin:10px auto 0;background:#3a2416;border-radius:6px;overflow:hidden;box-shadow:0 18px 45px #000b}.board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);overflow:hidden}.sq{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;cursor:pointer;user-select:none}.light{background:linear-gradient(135deg,#f1d7ad,#d7b47f)}.dark{background:linear-gradient(135deg,#b4865d,#8d5d3d)}.piece{display:block;font-family:"DejaVu Sans",Arial,sans-serif;font-size:clamp(40px,8.2vw,72px);line-height:1;transform:translateY(-1px);text-shadow:0 3px 3px #0009;z-index:2}.white{color:#fff}.black{color:#252525}.last{box-shadow:inset 0 0 0 999px #e9ad18aa}.selected{box-shadow:inset 0 0 0 4px #22c55e}.move:after{content:"";position:absolute;width:18%;height:18%;border-radius:50%;background:#6b442caa}.capture:after{content:"";position:absolute;inset:8%;border:4px solid #e33b2fcc;border-radius:50%}.check-king{box-shadow:inset 0 0 0 6px #ef4444,inset 0 0 28px #ef444488;animation:pulse .7s infinite alternate}.mate-king{box-shadow:inset 0 0 0 7px #dc2626,inset 0 0 38px #dc2626cc;animation:pulse .45s infinite alternate}.check-badge{position:absolute;right:5px;top:5px;z-index:5;background:#dc2626;color:white;border:2px solid white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}.mate-badge{width:auto;height:auto;border-radius:7px;padding:3px 5px;font-size:9px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}button{padding:11px 17px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#f8fafc;color:#111827}button.active{background:#22c55e;color:#052e16}button:disabled{opacity:.45;cursor:not-allowed}.hint{color:#94a3b8;font-size:12px;margin-top:12px}@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}@media(max-width:520px){body{padding:8px}.app{width:100%}.timers,.captured{width:96vw;gap:6px}.board-wrap{width:96vw;height:96vw;margin-top:8px}.piece{font-size:clamp(34px,11vw,58px)}.time{font-size:24px}.controls{gap:7px}.controls button{padding:10px 12px}}
</style>
</head>
<body><div class="app">
<h1>♟ Chess Game</h1><div class="sub">Classic board • Legal moves • Smart Computer</div><div id="status" class="status">White's turn</div>
<div class="timers"><div id="wc" class="clock active"><div class="name">♔ WHITE</div><div id="wt" class="time">10:00</div></div><div id="bc" class="clock"><div class="name">♚ BLACK</div><div id="bt" class="time">10:00</div></div></div>
<div class="captured"><div class="cap"><b>WHITE CAPTURED</b><span id="wcap" class="caps">—</span></div><div class="cap"><b>BLACK CAPTURED</b><span id="bcap" class="caps">—</span></div></div>
<div class="board-wrap"><div id="board" class="board"></div></div>
<div class="controls"><button id="newGame">New Game</button><button id="flip">↔ Flip Board</button><button id="undo">↩ Undo</button><button id="ai">🤖 Play vs Computer</button></div>
<div class="hint">🔊 Move • Capture • Check • Checkmate sounds are built in</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const boardEl=$('board'),statusEl=$('status'),wtEl=$('wt'),btEl=$('bt'),wcEl=$('wc'),bcEl=$('bc'),wcapEl=$('wcap'),bcapEl=$('bcap'),newBtn=$('newGame'),flipBtn=$('flip'),undoBtn=$('undo'),aiBtn=$('ai');
const ICON={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
const VALUE={p:100,n:320,b:330,r:500,q:900,k:20000};
let board=[],turn='w',selected=null,flipped=false,gameOver=false,aiMode=false,thinking=false,lastMove=null,captured={w:[],b:[]},time={w:600,b:600},timerId=null,lastTick=0,audio=null,history=[];
const inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8,color=p=>p?p[0]:null,type=p=>p?p[1]:null,clone=x=>x.map(r=>r.slice());
function initialBoard(){return [['br','bn','bb','bq','bk','bb','bn','br'],Array(8).fill('bp'),...Array.from({length:4},()=>Array(8).fill(null)),Array(8).fill('wp'),['wr','wn','wb','wq','wk','wb','wn','wr']].map(r=>r.slice())}
function sound(kind){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const s={move:[520,700],capture:[180,110],check:[880,660,880],mate:[980,760,540,360],end:[520,390,260]}[kind]||[520,700];s.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.09;o.type=kind==='capture'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.14)})}catch(e){}}
function pseudo(r,c){const p=board[r][c],co=color(p),t=type(p),out=[];if(!p)return out;const add=(rr,cc)=>{if(!inside(rr,cc))return false;if(!board[rr][cc]){out.push([rr,cc]);return true}if(color(board[rr][cc])!==co&&type(board[rr][cc])!=='k')out.push([rr,cc]);return false};if(t==='p'){const d=co==='w'?-1:1,st=co==='w'?6:1;if(inside(r+d,c)&&!board[r+d][c]){out.push([r+d,c]);if(r===st&&!board[r+2*d][c])out.push([r+2*d,c])}for(const dc of[-1,1])if(inside(r+d,c+dc)&&board[r+d][c+dc]&&color(board[r+d][c+dc])!==co&&type(board[r+d][c+dc])!=='k')out.push([r+d,c+dc])}if(t==='n')for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+dr,c+dc);if(t==='k')for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);if('brq'.includes(t)){const ds=[];if('bq'.includes(t))ds.push([-1,-1],[-1,1],[1,-1],[1,1]);if('rq'.includes(t))ds.push([-1,0],[1,0],[0,-1],[0,1]);for(const[dr,dc]of ds){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){if(!add(rr,cc))break;rr+=dr;cc+=dc}}}return out}
function attacked(r,c,by){const pr=by==='w'?r+1:r-1;for(const dc of[-1,1])if(inside(pr,c+dc)&&board[pr][c+dc]===by+'p')return true;for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])if(inside(r+dr,c+dc)&&board[r+dr][c+dc]===by+'n')return true;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if((dr||dc)&&inside(r+dr,c+dc)&&board[r+dr][c+dc]===by+'k')return true;for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){const p=board[rr][cc];if(p){if(color(p)===by&&'rq'.includes(type(p)))return true;break}rr+=dr;cc+=dc}}for(const[dr,dc]of[[-1,-1],[-1,1],[1,-1],[1,1]]){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){const p=board[rr][cc];if(p){if(color(p)===by&&'bq'.includes(type(p)))return true;break}rr+=dr;cc+=dc}}return false}
function inCheck(co){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]===co+'k')return attacked(r,c,co==='w'?'b':'w');return true}
function legal(r,c){const p=board[r][c],out=[];if(!p)return out;for(const[rr,cc]of pseudo(r,c)){const q=board[rr][cc];board[rr][cc]=p;board[r][c]=null;if(!inCheck(color(p)))out.push([rr,cc]);board[r][c]=p;board[rr][cc]=q}return out}
function allMoves(co){const a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(color(board[r][c])===co)for(const[toR,toC]of legal(r,c))a.push({from:[r,c],to:[toR,toC],capture:!!board[toR][toC]});return a}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function stopClock(){if(timerId){clearInterval(timerId);timerId=null}}
function saveHistory(){history.push({board:clone(board),turn,time:{...time},captured:{w:[...captured.w],b:[...captured.b]},last:lastMove,gameOver});if(history.length>80)history.shift()}
function startClock(){if(timerId||gameOver)return;lastTick=Date.now();timerId=setInterval(()=>{const now=Date.now(),e=Math.floor((now-lastTick)/1000);if(!e)return;lastTick+=e*1000;time[turn]=Math.max(0,time[turn]-e);if(time[turn]===0){gameOver=true;stopClock();sound('end')}render()},250)}
function finishState(){const check=inCheck(turn),moves=allMoves(turn);if(!moves.length)gameOver=true;return{check,moves,mate:gameOver&&check&&!moves.length}}
function makeMove(fr,fc,tr,tc){if(gameOver)return;saveHistory();if(!timerId)startClock();const p=board[fr][fc],q=board[tr][tc];if(q)captured[color(p)].push(q);board[tr][tc]=p;board[fr][fc]=null;if(type(p)==='p'&&(tr===0||tr===7))board[tr][tc]=color(p)+'q';lastMove=[[fr,fc],[tr,tc]];turn=turn==='w'?'b':'w';const st=finishState();sound(q?'capture':'move');if(st.check&&!gameOver)sound('check');if(st.mate)sound('mate');selected=null;render();if(aiMode&&turn==='b'&&!gameOver)computerMove()}
function clickSquare(r,c){if(gameOver||thinking||(aiMode&&turn==='b'))return;if(!timerId)startClock();try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}const p=board[r][c];if(!selected){if(color(p)===turn){selected=[r,c];render()}return}const[sr,sc]=selected;if(sr===r&&sc===c){selected=null;render();return}if(color(p)===turn){selected=[r,c];render();return}if(legal(sr,sc).some(m=>m[0]===r&&m[1]===c))makeMove(sr,sc,r,c)}
function applyTemp(m){const p=board[m.from[0]][m.from[1]],q=board[m.to[0]][m.to[1]];board[m.to[0]][m.to[1]]=p;board[m.from[0]][m.from[1]]=null;if(type(p)==='p'&&(m.to[0]===0||m.to[0]===7))board[m.to[0]][m.to[1]]=color(p)+'q';return q}
function undoTemp(m,q){const p=board[m.to[0]][m.to[1]];board[m.from[0]][m.from[1]]=p;board[m.to[0]][m.to[1]]=q}
function evaluate(){let score=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=board[r][c];if(!p)continue;const v=VALUE[type(p)];score+=(color(p)==='b'?-v:v)}if(inCheck('w'))score-=35;if(inCheck('b'))score+=35;return score}
function minimax(depth,alpha,beta,maximizing){const side=maximizing?'b':'w',moves=allMoves(side);if(!moves.length){if(inCheck(side))return maximizing?-999999-depth:999999+depth;return 0}if(depth===0)return evaluate();if(maximizing){let best=-Infinity;for(const m of moves){const q=applyTemp(m),v=minimax(depth-1,alpha,beta,false);undoTemp(m,q);best=Math.max(best,v);alpha=Math.max(alpha,v);if(beta<=alpha)break}return best}else{let best=Infinity;for(const m of moves){const q=applyTemp(m),v=minimax(depth-1,alpha,beta,true);undoTemp(m,q);best=Math.min(best,v);beta=Math.min(beta,v);if(beta<=alpha)break}return best}}
function computerMove(){if(!aiMode||turn!=='b'||gameOver||thinking)return;thinking=true;render();setTimeout(()=>{const moves=allMoves('b');if(!moves.length){thinking=false;render();return}let best=-Infinity,bestMoves=[];for(const m of moves){const q=applyTemp(m),score=minimax(2,-Infinity,Infinity,false);undoTemp(m,q);if(score>best){best=score;bestMoves=[m]}else if(score===best)bestMoves.push(m)}const m=bestMoves[Math.floor(Math.random()*bestMoves.length)];thinking=false;makeMove(m.from[0],m.from[1],m.to[0],m.to[1])},300)}
function renderCaptured(){wcapEl.textContent=captured.w.length?captured.w.map(p=>ICON[color(p)][type(p)]).join(' '):'—';bcapEl.textContent=captured.b.length?captured.b.map(p=>ICON[color(p)][type(p)]).join(' '):'—'}
function render(){const st=finishState(),check=st.check,mate=st.mate;statusEl.className='status';if(gameOver){if(time[turn]===0){statusEl.textContent='⏱️ Time out! 🏆 '+(turn==='w'?'Black':'White')+' wins.';statusEl.classList.add('winner')}else if(mate){statusEl.textContent='♛ CHECKMATE! 🏆 '+(turn==='w'?'Black':'White')+' wins!';statusEl.classList.add('mate')}else if(!st.moves.length)statusEl.textContent='½ Draw — no legal moves.'}else{statusEl.textContent=thinking?'🤖 Computer is thinking...':(turn==='w'?'White':'Black')+"'s turn"+(check?' — ⚠ CHECK!':'')+(aiMode?' — You are White':'');if(check)statusEl.classList.add('check')}boardEl.innerHTML='';for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const r=flipped?7-vr:vr,c=flipped?7-vc:vc,s=document.createElement('div');s.className='sq '+((r+c)%2?'dark':'light');if(lastMove&&((lastMove[0][0]===r&&lastMove[0][1]===c)||(lastMove[1][0]===r&&lastMove[1][1]===c)))s.classList.add('last');const king=check&&board[r][c]===turn+'k';if(king)s.classList.add(mate?'mate-king':'check-king');if(selected&&selected[0]===r&&selected[1]===c)s.classList.add('selected');if(!gameOver&&selected&&legal(selected[0],selected[1]).some(m=>m[0]===r&&m[1]===c))s.classList.add(board[r][c]?'capture':'move');const p=board[r][c];if(p){const z=document.createElement('span');z.className='piece '+(color(p)==='w'?'white':'black');z.textContent=ICON[color(p)][type(p)];s.appendChild(z);if(king){const b=document.createElement('span');b.className='check-badge '+(mate?'mate-badge':'');b.textContent=mate?'MATE':'⚠';s.appendChild(b)}}s.addEventListener('click',()=>clickSquare(r,c));boardEl.appendChild(s)}wtEl.textContent=fmt(time.w);btEl.textContent=fmt(time.b);wcEl.classList.toggle('active',!gameOver&&turn==='w');bcEl.classList.toggle('active',!gameOver&&turn==='b');wcEl.classList.toggle('low',time.w<=30&&time.w>0);bcEl.classList.toggle('low',time.b<=30&&time.b>0);renderCaptured();undoBtn.disabled=history.length===0||thinking;aiBtn.classList.toggle('active',aiMode)}
function newGame(){stopClock();board=initialBoard();turn='w';selected=null;gameOver=false;thinking=false;lastMove=null;captured={w:[],b:[]};time={w:600,b:600};history=[];render()}
newBtn.onclick=newGame;flipBtn.onclick=()=>{flipped=!flipped;render()};undoBtn.onclick=()=>{if(!history.length||thinking)return;let h=history.pop();board=clone(h.board);turn=h.turn;time={...h.time};captured={w:[...h.captured.w],b:[...h.captured.b]};lastMove=h.last;gameOver=h.gameOver;selected=null;if(aiMode&&turn==='b'&&history.length){h=history.pop();board=clone(h.board);turn=h.turn;time={...h.time};captured={w:[...h.captured.w],b:[...h.captured.b]};lastMove=h.last;gameOver=h.gameOver}stopClock();if(!gameOver)startClock();render()};aiBtn.onclick=()=>{aiMode=!aiMode;newGame()};newGame();
</script></body></html>
