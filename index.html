<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#263449,#0b1018);color:#fff;display:flex;justify-content:center;align-items:center;padding:20px}.app{width:min(95vw,620px);text-align:center}h1{margin:0 0 8px;font-size:clamp(28px,7vw,44px)}#status{min-height:28px;margin-bottom:14px;font-weight:700}.board{width:min(92vw,560px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #111827;border-radius:10px;overflow:hidden;box-shadow:0 18px 45px #0008}.square{display:flex;align-items:center;justify-content:center;font-size:clamp(30px,8vw,62px);cursor:pointer;user-select:none;position:relative}.light{background:#f0d9b5}.dark{background:#b58863}.selected{outline:5px solid #22c55e;outline-offset:-5px}.move::after{content:"";width:24%;height:24%;border-radius:50%;background:#22c55e99;position:absolute}.capture::after{content:"";position:absolute;inset:7%;border:5px solid #ef4444aa;border-radius:50%}.controls{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#111827}button:hover{transform:translateY(-1px)}.hint{margin-top:12px;color:#cbd5e1;font-size:14px}.piece{filter:drop-shadow(0 2px 1px #0008)}
</style>
</head>
<body>
<div class="app"><h1>♟ Chess Game</h1><div id="status">White's turn</div><div id="board" class="board"></div><div class="controls"><button id="newGame">New Game</button><button id="flip">Flip Board</button></div><div class="hint">Click a piece, then click a highlighted square.</div></div>
<script>
const icons={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
let board,turn,selected,gameOver,flipped=false;
function initial(){return [['br','bn','bb','bq','bk','bb','bn','br'],Array(8).fill('bp'),Array(8).fill(null),Array(8).fill(null),Array(8).fill(null),Array(8).fill(null),Array(8).fill('wp'),['wr','wn','wb','wq','wk','wb','wn','wr']].map(r=>r.slice())}
function color(p){return p?p[0]:null}function type(p){return p?p[1]:null}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}
function pseudo(r,c){const p=board[r][c],t=type(p),col=color(p),moves=[];if(!p)return moves;const add=(rr,cc)=>{if(!inside(rr,cc))return false;if(!board[rr][cc]){moves.push([rr,cc]);return true}if(color(board[rr][cc])!==col)moves.push([rr,cc]);return false};
if(t==='p'){let d=col==='w'?-1:1,start=col==='w'?6:1;if(inside(r+d,c)&&!board[r+d][c]){moves.push([r+d,c]);if(r===start&&!board[r+2*d][c])moves.push([r+2*d,c])}for(const dc of[-1,1])if(inside(r+d,c+dc)&&board[r+d][c+dc]&&color(board[r+d][c+dc])!==col)moves.push([r+d,c+dc]);}
if(t==='n')for(const [dr,dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+dr,c+dc);
if(t==='k')for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);
if(['b','r','q'].includes(t)){let dirs=[];if(['b','q'].includes(t))dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);if(['r','q'].includes(t))dirs.push([-1,0],[1,0],[0,-1],[0,1]);for(const[dr,dc]of dirs){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){if(!add(rr,cc))break;rr+=dr;cc+=dc}}}return moves}
function attacked(r,c,by){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++)if(color(board[rr][cc])===by){const p=board[rr][cc],t=type(p);if(t==='p'){let d=by==='w'?-1:1;if(r===rr+d&&Math.abs(c-cc)===1)return true}else if(t==='k'){if(Math.max(Math.abs(r-rr),Math.abs(c-cc))===1)return true}else if(pseudo(rr,cc).some(x=>x[0]===r&&x[1]===c))return true}return false}
function kingInCheck(col){let kr=-1,kc=-1;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]===col+'k'){kr=r;kc=c}return kr<0||attacked(kr,kc,col==='w'?'b':'w')}
function legal(r,c){const p=board[r][c],out=[];for(const [rr,cc] of pseudo(r,c)){const captured=board[rr][cc];board[rr][cc]=p;board[r][c]=null;if(!kingInCheck(color(p))){out.push([rr,cc])}board[r][c]=p;board[rr][cc]=captured}return out}
function anyLegal(col){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(color(board[r][c])===col&&legal(r,c).length)return true;return false}
function render(){const el=document.getElementById('board');el.innerHTML='';const status=document.getElementById('status');const check=kingInCheck(turn);if(gameOver){status.textContent=check?'Checkmate! '+(turn==='w'?'Black':'White')+' wins.':'Draw.'}else status.textContent=(turn==='w'?'White':'Black')+"'s turn"+(check?' — CHECK!':'');for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const r=flipped?7-vr:vr,c=flipped?7-vc:vc,s=document.createElement('div');s.className='square '+((r+c)%2?'dark':'light');if(selected&&selected[0]===r&&selected[1]===c)s.classList.add('selected');if(selected){const lm=legal(...selected);if(lm.some(x=>x[0]===r&&x[1]===c))s.classList.add(board[r][c]?'capture':'move')}const p=board[r][c];if(p)s.innerHTML='<span class="piece">'+icons[color(p)][type(p)]+'</span>';s.onclick=()=>clickSquare(r,c);el.appendChild(s)}}
function clickSquare(r,c){if(gameOver)return;const p=board[r][c];if(!selected){if(color(p)===turn){selected=[r,c];render()}return}const [sr,sc]=selected;if(sr===r&&sc===c){selected=null;render();return}if(color(p)===turn){selected=[r,c];render();return}if(legal(sr,sc).some(x=>x[0]===r&&x[1]===c)){board[r][c]=board[sr][sc];board[sr][sc]=null;if(type(board[r][c])==='p'&&(r===0||r===7))board[r][c]=color(board[r][c])+'q';turn=turn==='w'?'b':'w';selected=null;if(!anyLegal(turn))gameOver=true;render()} }
document.getElementById('newGame').onclick=()=>{board=initial();turn='w';selected=null;gameOver=false;render()};document.getElementById('flip').onclick=()=>{flipped=!flipped;render()};document.getElementById('newGame').click();
</script></body></html>
