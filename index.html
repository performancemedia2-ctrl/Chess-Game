<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Game</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#334155,#080b11 65%);color:#fff;font-family:Arial;display:flex;justify-content:center;padding:20px}.app{width:min(96vw,720px);text-align:center}h1{margin:0 0 5px;font-size:42px}.sub{color:#94a3b8;font-size:13px}.status{font-weight:800;min-height:28px}.timers,.captured{display:flex;gap:10px;justify-content:center;margin:8px auto;width:min(94vw,590px)}.clock,.cap{flex:1;background:#111827;border:2px solid #334155;border-radius:12px;padding:8px}.clock.active{border-color:#22c55e}.clock.low{border-color:#ef4444}.name,.cap b{font-size:11px;color:#94a3b8}.time{font-size:28px;font-weight:900}.cap{text-align:left;min-height:40px}.caps{font-size:21px;margin-left:6px}.wrap{width:min(94vw,590px);margin:auto;padding:9px;background:linear-gradient(145deg,#654b36,#20150e);border-radius:15px}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;border-radius:8px}.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}.light{background:#ead7b5}.dark{background:#a66e42}.piece{font-size:clamp(34px,8.5vw,66px);line-height:1;text-shadow:0 3px 3px #0009;z-index:2}.white{color:#fff}.black{color:#151515}.selected{box-shadow:inset 0 0 0 5px #22c55e}.move:after{content:"";position:absolute;width:20%;height:20%;border-radius:50%;background:#16a34acc}.capture:after{content:"";position:absolute;inset:8%;border:5px solid #ef4444cc;border-radius:50%}.last{box-shadow:inset 0 0 0 999px #facc1540}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}button{padding:11px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}button.active{background:#22c55e}.hint{color:#94a3b8;font-size:12px;margin-top:12px}</style></head><body><div class="app"><h1>♟ Chess Game</h1><div class="sub">Classic board • Legal moves • Smart Computer</div><div id="status" class="status"></div><div class="timers"><div id="wc" class="clock active"><div class="name">♔ WHITE</div><div id="wt" class="time">10:00</div></div><div id="bc" class="clock"><div class="name">♚ BLACK</div><div id="bt" class="time">10:00</div></div></div><div class="captured"><div class="cap"><b>WHITE CAPTURED</b><span id="wcap" class="caps">—</span></div><div class="cap"><b>BLACK CAPTURED</b><span id="bcap" class="caps">—</span></div></div><div class="wrap"><div id="board" class="board"></div></div><div class="controls"><button id="new">New Game</button><button id="flip">↔ Flip Board</button><button id="ai">🤖 Play vs Computer</button></div><div class="hint">🔊 Move • Capture • Check sounds are built in</div></div><script>
const I={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};let B,T,S,over,fl=false,AI=false,thinking=false,last=null,cap={w:[],b:[]},tm={w:600,b:600},started=false,timer=null,tick=0,ctx=null;const C=p=>p&&p[0],K=p=>p&&p[1],inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function aud(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function tone(f,d,type='sine',v=.05,delay=0){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ctx.destination);o.start(n);o.stop(n+d+.02)}function snd(x){aud();if(x==='move'){tone(520,.08,'triangle');tone(700,.06,'triangle',.03,.05)}else if(x==='capture'){tone(180,.12,'sawtooth');tone(110,.14,'sawtooth',.04,.08)}else if(x==='check'){tone(880,.12,'square');tone(660,.15,'square',.04,.12)}else{tone(520,.1);tone(390,.1,'triangle',.04,.12);tone(260,.2,'triangle',.03,.25)}}
function startPos(){return [['br','bn','bb','bq','bk','bb','bn','br'],Array(8).fill('bp'),Array(8).fill(null),Array(8).fill(null),Array(8).fill(null),Array(8).fill(null),Array(8).fill('wp'),['wr','wn','wb','wq','wk','wb','wn','wr']].map(r=>r.slice())}function pseudo(r,c){let p=B[r][c],t=K(p),co=C(p),a=[];if(!p)return a;let add=(x,y)=>{if(!inside(x,y))return false;if(!B[x][y]){a.push([x,y]);return true}if(C(B[x][y])!==co)a.push([x,y]);return false};if(t==='p'){let d=co==='w'?-1:1,s=co==='w'?6:1;if(inside(r+d,c)&&!B[r+d][c]){a.push([r+d,c]);if(r===s&&!B[r+2*d][c])a.push([r+2*d,c])}for(let q of[-1,1])if(inside(r+d,c+q)&&B[r+d][c+q]&&C(B[r+d][c+q])!==co)a.push([r+d,c+q])}if(t==='n')for(let[x,y]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+x,c+y);if(t==='k')for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)if(x||y)add(r+x,c+y);if('brq'.includes(t)){let ds=[];if('bq'.includes(t))ds.push([-1,-1],[-1,1],[1,-1],[1,1]);if('rq'.includes(t))ds.push([-1,0],[1,0],[0,-1],[0,1]);for(let[x,y]of ds){let rr=r+x,cc=c+y;while(inside(rr,cc)){if(!add(rr,cc))break;rr+=x;cc+=y}}}return a}function attacked(r,c,by){for(let r0=0;r0<8;r0++)for(let c0=0;c0<8;c0++)if(C(B[r0][c0])===by){let p=B[r0][c0],t=K(p);if(t==='p'){let d=by==='w'?-1:1;if(r===r0+d&&Math.abs(c-c0)===1)return true}else if(t==='k'){if(Math.max(Math.abs(r-r0),Math.abs(c-c0))===1)return true}else if(pseudo(r0,c0).some(x=>x[0]===r&&x[1]===c))return true}return false}function inCheck(co){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(B[r][c]===co+'k')return attacked(r,c,co==='w'?'b':'w');return true}function legal(r,c){let p=B[r][c],a=[];for(let[x,y]of pseudo(r,c)){let q=B[x][y];if(q&&K(q)==='k')continue;B[x][y]=p;B[r][c]=null;if(!inCheck(C(p)))a.push([x,y]);B[r][c]=p;B[x][y]=q}return a}function all(co){let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(C(B[r][c])===co)for(let[x,y]of legal(r,c))a.push({f:[r,c],t:[x,y]});return a}
function fmt(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function stop(){if(timer){clearInterval(timer);timer=null}}function start(){if(started||over)return;started=true;tick=Date.now();timer=setInterval(()=>{let n=Date.now(),e=Math.floor((n-tick)/1000);if(!e)return;tick+=e*1000;tm[T]=Math.max(0,tm[T]-e);if(!tm[T]){over=true;stop();snd('end')}render()},250)}function renderCaps(){wcap.textContent=cap.w.length?cap.w.map(p=>I[C(p)][K(p)]).join(' '):'—';bcap.textContent=cap.b.length?cap.b.map(p=>I[C(p)][K(p)]).join(' '):'—'}function render(){board.innerHTML='';let ck=inCheck(T),ms=all(T);status.textContent=over?(tm[T]===0?'⏱️ Time out! '+(T==='w'?'Black':'White')+' wins.':ck?'♛ Checkmate! '+(T==='w'?'Black':'White')+' wins.':'½ Draw.'):thinking?'🤖 Computer is thinking...':(T==='w'?'White':'Black')+"'s turn"+(ck?' — CHECK!':'')+(AI&&T==='w'?' — You play White':'');ai.classList.toggle('active',AI);for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){let r=fl?7-vr:vr,c=fl?7-vc:vc,s=document.createElement('div');s.className='sq '+((r+c)%2?'dark':'light');if(last&&((last[0][0]===r&&last[0][1]===c)||(last[1][0]===r&&last[1][1]===c)))s.classList.add('last');if(S&&S[0]===r&&S[1]===c)s.classList.add('selected');if(S&&legal(...S).some(x=>x[0]===r&&x[1]===c))s.classList.add(B[r][c]?'capture':'move');let p=B[r][c];if(p){let z=document.createElement('span');z.className='piece '+(C(p)==='w'?'white':'black');z.textContent=I[C(p)][K(p)];s.appendChild(z)}s.onclick=()=>click(r,c);board.appendChild(s)}wt.textContent=fmt(tm.w);bt.textContent=fmt(tm.b);wc.classList.toggle('active',started&&!over&&T==='w');bc.classList.toggle('active',started&&!over&&T==='b');wc.classList.toggle('low',tm.w<=30&&tm.w>0);bc.classList.toggle('low',tm.b<=30&&tm.b>0);renderCaps()}
function make(fx,fy,tx,ty){if(!started)start();let p=B[fx][fy],q=B[tx][ty];if(q)cap[C(p)].push(q);B[tx][ty]=p;B[fx][fy]=null;if(K(p)==='p'&&(tx===0||tx===7))B[tx][ty]=C(p)+'q';last=[[fx,fy],[tx,ty]];T=T==='w'?'b':'w';S=null;let ck=inCheck(T),ms=all(T);snd(q?'capture':'move');if(!ms.length){over=true;snd('end')}else if(ck)snd('check')}
function click(r,c){if(over||thinking||(AI&&T==='b'))return;aud();let p=B[r][c];if(!S){if(C(p)===T){S=[r,c];render()}return}let[fR,fC]=S;if(fR===r&&fC===c){S=null;render();return}if(C(p)===T){S=[r,c];render();return}if(legal(fR,fC).some(x=>x[0]===r&&x[1]===c)){make(fR,fC,r,c);render();if(AI&&!over&&T==='b')setTimeout(computer,250)}}function computer(){if(!AI||T!=='b'||over)return;thinking=true;render();setTimeout(()=>{let ms=all('b');if(!ms.length){over=true;thinking=false;render();return}let m=ms[Math.floor(Math.random()*ms.length)];make(...m.f,...m.t);thinking=false;render()},200)}
new.onclick=()=>{stop();B=startPos();T='w';S=null;over=false;thinking=false;last=null;cap={w:[],b:[]};tm={w:600,b:600};started=false;render()};flip.onclick=()=>{fl=!fl;render()};ai.onclick=()=>{AI=!AI;new.click()};new.click();
</script></body></html>
