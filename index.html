<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Game</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#334155,#080b11 65%);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:20px}.app{width:min(96vw,720px);text-align:center}h1{margin:0 0 4px;font-size:42px}.sub{color:#94a3b8;font-size:13px;margin-bottom:8px}.status{font-weight:800;min-height:28px}.timers,.captured{display:flex;gap:10px;justify-content:center;margin:8px auto;width:min(94vw,590px)}.clock,.cap{flex:1;background:#111827;border:2px solid #334155;border-radius:12px;padding:8px}.clock.active{border-color:#22c55e}.clock.low{border-color:#ef4444}.name{font-size:11px;color:#94a3b8;font-weight:700}.time{font-size:28px;font-weight:900}.cap{text-align:left;min-height:40px}.cap b{font-size:10px;color:#94a3b8}.caps{font-size:21px;margin-left:6px}.wrap{width:min(94vw,590px);margin:auto;padding:9px;background:linear-gradient(145deg,#654b36,#20150e);border-radius:15px}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);overflow:hidden;border-radius:8px}.sq{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}.light{background:#ead7b5}.dark{background:#a66e42}.piece{font-size:clamp(34px,8.5vw,66px);line-height:1;text-shadow:0 3px 3px #0009;z-index:2}.white{color:#fff}.black{color:#151515}.selected{box-shadow:inset 0 0 0 5px #22c55e}.move:after{content:"";position:absolute;width:20%;height:20%;border-radius:50%;background:#16a34acc}.capture:after{content:"";position:absolute;inset:8%;border:5px solid #ef4444cc;border-radius:50%}.last{box-shadow:inset 0 0 0 999px #facc1540}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px}button{padding:11px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}button.active{background:#22c55e}.hint{color:#94a3b8;font-size:12px;margin-top:12px}@media(max-width:500px){.time{font-size:24px}.cap{padding:6px}.caps{font-size:18px}}
</style></head><body><div class="app"><h1>♟ Chess Game</h1><div class="sub">Classic board • Legal moves • Smart Computer</div><div id="status" class="status">White's turn</div><div class="timers"><div id="wc" class="clock active"><div class="name">♔ WHITE</div><div id="wt" class="time">10:00</div></div><div id="bc" class="clock"><div class="name">♚ BLACK</div><div id="bt" class="time">10:00</div></div></div><div class="captured"><div class="cap"><b>WHITE CAPTURED</b><span id="wcap" class="caps">—</span></div><div class="cap"><b>BLACK CAPTURED</b><span id="bcap" class="caps">—</span></div></div><div class="wrap"><div id="board" class="board"></div></div><div class="controls"><button id="new">New Game</button><button id="flip">↔ Flip Board</button><button id="ai">🤖 Play vs Computer</button></div><div class="hint">🔊 Move • Capture • Check sounds are built in</div></div>
<script>
const I={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};let B,T,S,over,flip=false,AI=false,thinking=false,last=null,cap={w:[],b:[]},time={w:600,b:600},started=false,timer=null,lastTick=0,ctx=null;
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}function beep(f,d,t='sine',v=.05,delay=0){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime+delay;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ctx.destination);o.start(n);o.stop(n+d+.03)}function sound(k){audio();if(k==='move'){beep(520,.08,'triangle');beep(700,.06,'triangle',.035,.05)}if(k==='capture'){beep(180,.12,'sawtooth');beep(110,.14,'sawtooth',.04,.08)}if(k==='check'){beep(880,.12,'square');beep(660,.15,'square',.04,.12)}if(k==='end'){beep(520,.1);beep(390,.1,'triangle',.04,.12);beep(260,.2,'triangle',.03,.25)}}
const C=p=>p?.[0],K=p=>p?.[1],inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;function init(){return [['br','bn','bb','bq','bk','bb','bn','br'],Array(8).fill('bp'),Array(8).fill(null),Array(8).fill(null),Array(8).fill(null),Array(8).fill(null),Array(8).fill('wp'),['wr','wn','wb','wq','wk','wb','wn','wr']].map(x=>x.slice())}function moves(r,c){let p=B[r][c],t=K(p),co=C(p),a=[];if(!p)return a;let add=(x,y)=>{if(!inb(x,y))return false;if(!B[x][y]){a.push([x,y]);return true}if(C(B[x][y])!==co)a.push([x,y]);return false};if(t==='p'){let d=co==='w'?-1:1,s=co==='w'?6:1;if(inb(r+d,c)&&!B[r+d][c]){a.push([r+d,c]);if(r===s&&!B[r+2*d][c])a.push([r+2*d,c])}for(let q of[-1,1])if(inb(r+d,c+q)&&B[r+d][c+q]&&C(B[r+d][c+q])!==co)a.push([r+d,c+q])}if(t==='n')for(let[x,y]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+x,c+y);if(t==='k')for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)if(x||y)add(r+x,c+y);if('brq'.includes(t)){let ds=[];if('bq'.includes(t))ds.push([-1,-1],[-1,1],[1,-1],[1,1]);if('rq'.includes(t))ds.push([-1,0],[1,0],[0,-1],[0,1]);for(let[x,y]of ds){let rr=r+x,cc=c+y;while(inb(rr,cc)){if(!add(rr,cc))break;rr+=x;cc+=y}}}return a}function attack(r,c,by){for(let x=0;x<8;x++)for(let y=0;y<8;y++)if(C(B[x][y])===by){let p=B[x][y],t=K(p);if(t==='p'){let d=by==='w'?-1:1;if(r===x+d&&Math.abs(c-y)===1)return true}else if(t==='k'){if(Math.max(Math.abs(r-x),Math.abs(c-y))===1)return true}else if(moves(x,y).some(z=>z[0]===r&&z[1]===c))return true}return false}function check(co){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(B[r][c]===co+'k')return attack(r,c,co==='w'?'b':'w');return true}function legal(r,c){let p=B[r][c],a=[];for(let[x,y]of moves(r,c)){let q=B[x][y];if(q&&K(q)==='k')continue;B[x][y]=p;B[r][c]=null;if(!check(C(p)))a.push([x,y]);B[r][c]=p;B[x][y]=q}return a}function all(co){let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(C(B[r][c])===co)for(let[x,y]of legal(r,c))a.push({f:[r,c],t:[x,y]});return a}
function fmt(x){return String(Math.floor(Math.max(0,x)/60)).padStart(2,'0')+':'+String(Math.max(0,x)%60).padStart(2,'0')}function stop(){if(timer){clearInterval(timer);timer=null}}function start(){if(started||over)return;started=true;lastTick=Date.now();timer=setInterval(()=>{let n=Date.now(),e=Math.floor((n-lastTick)/1000);if(!e)return;lastTick+=e*1000;time[T]=Math.max(0,time[T]-e);if(!time[T]){over=true;stop();sound('end')}render()},250)}function clocks(){wt.textContent=fmt(time.w);bt.textContent=fmt(time.b);wc.classList.toggle('active',started&&!over&&T==='w');bc.classList.toggle('active',started&&!over&&T==='b');wc.classList.toggle('low',time.w<=30&&time.w>0);bc.classList.toggle('low',time.b<=30&&time.b>0)}function captured(){wcap.textContent=cap.w.length?cap.w.map(p=>I[C(p)][K(p)]).join(' '):'—';bcap.textContent=cap.b.length?cap.b.map(p=>I[C(p)][K(p)]).join(' '):'—'}
function render(){board.innerHTML='';let ck=check(T);status.textContent=over?(time[T]===0?'⏱️ Time out! '+(T==='w'?'Black':'White')+' wins.':ck?'♛ Checkmate! '+(T==='w'?'Black':'White')+' wins.':'½ Draw.'):thinking?'🤖 Computer is thinking...':(T==='w'?'White':'Black')+"'s turn"+(ck?' — CHECK!':'')+(AI&&T==='w'?' — You play White':'');ai.classList.toggle('active',AI);for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){let r=flip?7-vr:vr,c=flip?7-vc:vc,s=document.createElement('div');s.className='sq '+((r+c)%2?'dark':'light');if(last&&((last[0][0]===r&&last[0][1]===c)||(last[1][0]===r&&last[1][1]===c)))s.classList.add('last');if(S&&S[0]===r&&S[1]===c)s.classList.add('selected');if(S&&legal(...S).some(x=>x[0]===r&&x[1]===c))s.classList.add(B[r][c]?'capture':'move');let p=B[r][c];if(p){let z=document.createElement('span');z.className='piece '+(C(p)==='w'?'white':'black');z.textContent=I[C(p)][K(p)];s.appendChild(z)}s.onclick=()=>click(r,c);board.appendChild(s)}clocks();captured()}
function make(fx,fy,tx,ty){if(!started)start();let p=B[fx][fy],q=B[tx][ty];if(q)cap[C(p)].push(q);B[tx][ty]=p;B[fx][fy]=null;if(K(p)==='p'&&(tx===0||tx===7))B[tx][ty]=C(p)+'q';last=[[fx,fy],[tx,ty]];T=T==='w'?'b':'w';S=null;let ck=check(T),ms=all(T);sound(q?'capture':'move');if(!ms.length){over=true;sound('end')}else if(ck)sound('check')}
function click(r,c){if(over||thinking||(AI&&T==='b'))return;audio();let p=B[r][c];if(!S){if(C(p)===T){S=[r,c];render()}return}let[fR,fC]=S;if(fR===r&&fC===c){S=null;render();return}if(C(p)===T){S=[r,c];render();return}if(legal(fR,fC).some(x=>x[0]===r&&x[1]===c)){make(fR,fC,r,c);render();if(AI&&!over&&T==='b')setTimeout(computer,250)}}
const val={p:100,n:320,b:330,r:500,q:900,k:20000};function score(){let s=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(B[r][c])s+=(C(B[r][c])==='b'?1:-1)*val[K(B[r][c)]];return s}function tmp(m){let p=B[m.f[0]][m.f[1]],q=B[m.t[0]][m.t[1]];B[m.t[0]][m.t[1]]=p;B[m.f[0]][m.f[1]]=null;return[p,q]}function unt(m,s){B[m.f[0]][m.f[1]]=s[0];B[m.t[0]][m.t[1]]=s[1]}function mini(d,a,b,max){let ms=all(max?'b':'w');if(!d||!ms.length)return score();if(max){let v=-1e9;for(let m of ms){let s=tmp(m),x=mini(d-1,a,b,false);unt(m,s);v=Math.max(v,x);a=Math.max(a,x);if(b<=a)break}return v}let v=1e9;for(let m of ms){let s=tmp(m),x=mini(d-1,a,b,true);unt(m,s);v=Math.min(v,x);b=Math.min(b,x);if(b<=a)break}return v}function computer(){if(!AI||T!=='b'||over)return;thinking=true;render();setTimeout(()=>{let ms=all('b'),best=-1e9,pick=ms[0];for(let m of ms){let s=tmp(m),v=mini(2,-1e9,1e9,false)+Math.random()*3;unt(m,s);if(v>best){best=v;pick=m}}make(...pick.f,...pick.t);thinking=false;render()},150)}
new.onclick=()=>{stop();B=init();T='w';S=null;over=false;thinking=false;last=null;cap={w:[],b:[]};time={w:600,b:600};started=false;render()};flip.onclick=()=>{flip=!flip;render()};ai.onclick=()=>{AI=!AI;new.click()};new.click();
</script></body></html>
