<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chess Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,#334155,#111827 42%,#070b12);color:#fff;display:flex;justify-content:center;align-items:center;padding:22px}.app{width:min(96vw,720px);text-align:center}h1{margin:0;font-size:clamp(30px,7vw,46px);text-shadow:0 3px 12px #0008}.subtitle{color:#94a3b8;margin:5px 0 8px;font-size:13px}.status{min-height:30px;margin:4px 0 10px;font-weight:800;font-size:17px}.timers{display:flex;justify-content:center;gap:14px;margin:0 auto 12px}.clock{min-width:150px;padding:10px 18px;border-radius:12px;background:#111827;border:2px solid #334155;box-shadow:0 6px 18px #0005}.clock.active{border-color:#22c55e;box-shadow:0 0 18px #22c55e44}.clock.low{border-color:#ef4444;animation:pulse 1s infinite}.clock .name{font-size:12px;color:#94a3b8;font-weight:700;text-transform:uppercase}.clock .time{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}@keyframes pulse{50%{box-shadow:0 0 22px #ef444466}}.captured{display:flex;justify-content:space-between;gap:12px;margin:0 auto 12px;width:min(94vw,590px)}.capture-box{flex:1;min-height:38px;padding:7px 10px;border-radius:10px;background:#111827cc;border:1px solid #334155;display:flex;align-items:center;gap:7px;text-align:left}.capture-title{font-size:11px;color:#94a3b8;font-weight:800;white-space:nowrap}.capture-pieces{font-family:"DejaVu Sans","Segoe UI Symbol",serif;font-size:21px}.board-wrap{width:min(94vw,590px);margin:auto;padding:10px;background:linear-gradient(145deg,#5b4635,#21170f);border:1px solid #9a7958;border-radius:16px;box-shadow:0 22px 55px #000b}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border-radius:8px;overflow:hidden}.square{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}.square:hover{filter:brightness(1.09)}.light{background:linear-gradient(135deg,#f1dfc1,#dfc49c)}.dark{background:linear-gradient(135deg,#a97545,#86582f)}.piece{font-family:"DejaVu Sans","Segoe UI Symbol",serif;font-size:clamp(34px,8.6vw,66px);line-height:1;z-index:2;filter:drop-shadow(0 3px 2px #0009)}.piece.white{color:#fff;text-shadow:0 1px 0 #bbb,0 3px 3px #0008}.piece.black{color:#171717;text-shadow:0 1px 0 #555,0 3px 3px #0008}.selected{box-shadow:inset 0 0 0 5px #22c55e,inset 0 0 28px #22c55e66}.move:after{content:"";position:absolute;width:21%;height:21%;border-radius:50%;background:#16a34acc;box-shadow:0 0 0 3px #fff4}.capture:after{content:"";position:absolute;inset:8%;border:5px solid #ef4444cc;border-radius:50%}.last{box-shadow:inset 0 0 0 999px #facc1540}.thinking{opacity:.7;pointer-events:none}.controls{margin-top:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:1px solid #ffffff22;border-radius:10px;padding:11px 17px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(#fff,#e5e7eb);color:#111827;box-shadow:0 5px 14px #0005}button:hover{transform:translateY(-2px)}button.active{background:linear-gradient(#4ade80,#16a34a);color:#052e16}.hint{margin:13px auto 0;color:#94a3b8;font-size:13px;line-height:1.5}@media(max-width:500px){body{padding:12px}.board-wrap{padding:6px}.piece{font-size:11vw}.clock{min-width:125px;padding:8px 12px}.clock .time{font-size:25px}.captured{gap:6px}.capture-title{font-size:10px}.capture-pieces{font-size:18px}}
</style></head>
<body><div class="app"><h1>♟ Chess Game</h1><div class="subtitle">Classic board • Legal moves • Smart Computer</div><div id="status" class="status">White's turn</div>
<div class="timers"><div id="whiteClock" class="clock active"><div class="name">♔ White</div><div id="whiteTime" class="time">10:00</div></div><div id="blackClock" class="clock"><div class="name">♚ Black</div><div id="blackTime" class="time">10:00</div></div></div>
<div class="captured"><div class="capture-box"><span class="capture-title">WHITE CAPTURED</span><span id="whiteCaptured" class="capture-pieces">—</span></div><div class="capture-box"><span class="capture-title">BLACK CAPTURED</span><span id="blackCaptured" class="capture-pieces">—</span></div></div>
<div class="board-wrap"><div id="board" class="board"></div></div><div class="controls"><button id="newGame">New Game</button><button id="flip">↔ Flip Board</button><button id="aiMode">🤖 Play vs Computer</button></div><div class="hint">🔊 Move sound • Capture sound • Check sound • 10-minute clocks</div></div>
<script>
const icons={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};
let board,turn,selected,gameOver,flipped=false,vsComputer=false,thinking=false,lastMove=null;let clocks={w:600,b:600},clockStarted=false,timerId=null,lastTick=0,timeoutWinner=null,captured={w:[],b:[]};let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,duration,type='sine',volume=.055,delay=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,audioCtx.currentTime+delay);g.gain.linearRampToValueAtTime(volume,audioCtx.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+duration);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+duration+.02)}
function playSound(kind){initAudio();if(kind==='move'){tone(520,.08,'triangle');tone(700,.06,'triangle',.035,.05)}else if(kind==='capture'){tone(180,.12,'sawtooth',.06);tone(110,.14,'sawtooth',.045,.08)}else if(kind==='check'){tone(880,.12,'square',.045);tone(660,.16,'square',.04,.12)}else if(kind==='gameover'){tone(520,.12,'triangle');tone(390,.12,'triangle',.04,.13);tone(260,.2,'triangle',.035,.26)}}
function initial(){return [['br','bn','bb','bq','bk','bb','bn','br'],Array(8).fill('bp'),Array(8).fill(null),Array(8).fill(null),Array(8).fill(null),Array(8).fill(null),Array(8).fill('wp'),['wr','wn','wb','wq','wk','wb','wn','wr']].map(r=>r.slice())}function color(p){return p?p[0]:null}function type(p){return p?p[1]:null}function inside(r,c){return r>=0&&r<8&&c>=0&&c<8}function formatTime(s){return String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0')}
function stopClock(){if(timerId){clearInterval(timerId);timerId=null}}function startClock(){if(clockStarted||gameOver)return;clockStarted=true;lastTick=Date.now();timerId=setInterval(()=>{if(gameOver)return stopClock();const now=Date.now(),e=Math.floor((now-lastTick)/1000);if(!e)return;lastTick+=e*1000;clocks[turn]=Math.max(0,clocks[turn]-e);if(clocks[turn]===0){timeoutWinner=turn==='w'?'b':'w';gameOver=true;selected=null;stopClock();playSound('gameover')}render()},250)}
function updateClocks(){const w=document.getElementById('whiteClock'),b=document.getElementById('blackClock');whiteTime.textContent=formatTime(clocks.w);blackTime.textContent=formatTime(clocks.b);w.classList.toggle('active',clockStarted&&!gameOver&&turn==='w');b.classList.toggle('active',clockStarted&&!gameOver&&turn==='b');w.classList.toggle('low',clocks.w<=30&&clocks.w>0);b.classList.toggle('low',clocks.b<=30&&clocks.b>0)}function renderCaptured(){whiteCaptured.textContent=captured.w.length?captured.w.map(p=>icons[color(p)][type(p)]).join(' '):'—';blackCaptured.textContent=captured.b.length?captured.b.map(p=>icons[color(p)][type(p)].join(' '):'—'}
function pseudo(r,c){const p=board[r][c],t=type(p),col=color(p),m=[];if(!p)return m;const add=(rr,cc)=>{if(!inside(rr,cc))return false;if(!board[rr][cc]){m.push([rr,cc]);return true}if(color(board[rr][cc])!==col)m.push([rr,cc]);return false};if(t==='p'){let d=col==='w'?-1:1,s=col==='w'?6:1;if(inside(r+d,c)&&!board[r+d][c]){m.push([r+d,c]);if(r===s&&!board[r+2*d][c])m.push([r+2*d,c])}for(const dc of[-1,1])if(inside(r+d,c+dc)&&board[r+d][c+dc]&&color(board[r+d][c+dc])!==col)m.push([r+d,c+dc])}if(t==='n')for(const[dr,dc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+dr,c+dc);if(t==='k')for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc);if(['b','r','q'].includes(t)){let d=[];if(['b','q'].includes(t))d.push([-1,-1],[-1,1],[1,-1],[1,1]);if(['r','q'].includes(t))d.push([-1,0],[1,0],[0,-1],[0,1]);for(const[dr,dc]of d){let rr=r+dr,cc=c+dc;while(inside(rr,cc)){if(!add(rr,cc))break;rr+=dr;cc+=dc}}}return m}
function attacked(r,c,by){for(let rr=0;rr<8;rr++)for(let cc=0;cc<8;cc++)if(color(board[rr][cc])===by){const p=board[rr][cc],t=type(p);if(t==='p'){let d=by==='w'?-1:1;if(r===rr+d&&Math.abs(c-cc)===1)return true}else if(t==='k'){if(Math.max(Math.abs(r-rr),Math.abs(c-cc))===1)return true}else if(pseudo(rr,cc).some(x=>x[0]===r&&x[1]===c))return true}return false}function kingInCheck(col){let kr=-1,kc=-1;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]===col+'k'){kr=r;kc=c}return kr<0||attacked(kr,kc,col==='w'?'b':'w')}
function legal(r,c){const p=board[r][c],out=[];for(const[rr,cc]of pseudo(r,c)){const cap=board[rr][cc];if(cap&&type(cap)==='k')continue;board[rr][cc]=p;board[r][c]=null;if(!kingInCheck(color(p)))out.push([rr,cc]);board[r][c]=p;board[rr][cc]=cap}return out}function allLegal(col){const a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(color(board[r][c])===col)for(const[toR,toC]of legal(r,c))a.push({from:[r,c],to:[toR,toC]});return a}
function render(){boardEl.innerHTML='';const check=kingInCheck(turn);if(timeoutWinner)status.textContent='⏱️ Time out! '+(timeoutWinner==='w'?'White':'Black')+' wins.';else if(gameOver)status.textContent=check?'♛ Checkmate! '+(turn==='w'?'Black':'White')+' wins.':'½ Draw.';else if(thinking)status.textContent='🤖 Computer is thinking...';else status.textContent=(turn==='w'?'White':'Black')+"'s turn"+(check?' — CHECK!':'')+(vsComputer&&turn==='w'?' — You play White':'');aiMode.classList.toggle('active',vsComputer);for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const r=flipped?7-vr:vr,c=flipped?7-vc:vc,s=document.createElement('div');s.className='square '+((r+c)%2?'dark':'light');if(lastMove&&((lastMove[0][0]===r&&lastMove[0][1]===c)||(lastMove[1][0]===r&&lastMove[1][1]===c)))s.classList.add('last');if(selected&&selected[0]===r&&selected[1]===c)s.classList.add('selected');if(selected&&legal(...selected).some(x=>x[0]===r&&x[1]===c))s.classList.add(board[r][c]?'capture':'move');const p=board[r][c];if(p){const q=document.createElement('span');q.className='piece '+(color(p)==='w'?'white':'black');q.textContent=icons[color(p)][type(p)];s.appendChild(q)}s.onclick=()=>clickSquare(r,c);boardEl.appendChild(s)}updateClocks();renderCaptured();boardEl.classList.toggle('thinking',thinking)}
function makeMove(sr,sc,r,c){if(!clockStarted)startClock();const moving=board[sr][sc],cap=board[r][c];if(cap)captured[color(moving)].push(cap);board[r][c]=moving;board[sr][sc]=null;if(type(board[r][c])==='p'&&(r===0||r===7))board[r][c]=color(board[r][c])+'q';lastMove=[[sr,sc],[r,c]];const mover=turn;turn=turn==='w'?'b':'w';selected=null;const check=kingInCheck(turn),hasMoves=allLegal(turn).length>0;playSound(cap?'capture':'move');if(!hasMoves){gameOver=true;playSound('gameover')}else if(check)playSound('check')}
function clickSquare(r,c){if(gameOver||thinking||(vsComputer&&turn==='b'))return;initAudio();const p=board[r][c];if(!selected){if(color(p)===turn){selected=[r,c];render()}return}const[sr,sc]=selected;if(sr===r&&sc===c){selected=null;render();return}if(color(p)===turn){selected=[r,c];render();return}if(legal(sr,sc).some(x=>x[0]===r&&x[1]===c)){makeMove(sr,sc,r,c);render();if(vsComputer&&!gameOver&&turn==='b')setTimeout(computerMove,280)}}
const values={p:100,n:320,b:330,r:500,q:900,k:20000};function evaluate(){let s=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=board[r][c];if(p)s+=(color(p)==='b'?1:-1)*values[type(p)]}return s}function temp(m){const p=board[m.from[0]][m.from[1]],cap=board[m.to[0]][m.to[1]];board[m.to[0]][m.to[1]]=p;board[m.from[0]][m.from[1]]=null;return{p,cap}}function untemp(m,s){board[m.from[0]][m.from[1]]=s.p;board[m.to[0]][m.to[1]]=s.cap}function minimax(d,a,b,max){const ms=allLegal(max?'b':'w');if(d===0||!ms.length)return !ms.length&&kingInCheck(max?'b':'w')?(max?-999999:999999):evaluate();if(max){let v=-Infinity;for(const m of ms){const s=temp(m),x=minimax(d-1,a,b,false);untemp(m,s);v=Math.max(v,x);a=Math.max(a,x);if(b<=a)break}return v}let v=Infinity;for(const m of ms){const s=temp(m),x=minimax(d-1,a,b,true);untemp(m,s);v=Math.min(v,x);b=Math.min(b,x);if(b<=a)break}return v}
function computerMove(){if(!vsComputer||turn!=='b'||gameOver)return;thinking=true;render();setTimeout(()=>{const ms=allLegal('b');if(!ms.length){gameOver=true;thinking=false;render();return}let best=-Infinity,picks=[];for(const m of ms){const s=temp(m),v=minimax(2,-Infinity,Infinity,false)+Math.random()*4;untemp(m,s);if(v>best+.01){best=v;picks=[m]}else if(Math.abs(v-best)<.01)picks.push(m)}const m=picks[Math.floor(Math.random()*picks.length)];makeMove(m.from[0],m.from[1],m.to[0],m.to[1]);thinking=false;render()},180)}
newGame.onclick=()=>{stopClock();board=initial();turn='w';selected=null;gameOver=false;thinking=false;lastMove=null;clocks={w:600,b:600};clockStarted=false;timeoutWinner=null;captured={w:[],b:[]};render()};flip.onclick=()=>{flipped=!flipped;render()};aiMode.onclick=()=>{vsComputer=!vsComputer;newGame.click()};newGame.click();
const boardEl=document.getElementById('board'),status=document.getElementById('status'),whiteTime=document.getElementById('whiteTime'),blackTime=document.getElementById('blackTime'),whiteCaptured=document.getElementById('whiteCaptured'),blackCaptured=document.getElementById('blackCaptured'),aiMode=document.getElementById('aiMode');
</script></body></html>
