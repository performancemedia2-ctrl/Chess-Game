name: Remove bottom feature strip

on:
  push:

permissions:
  contents: write

jobs:
  remove-feature-strip:
    if: github.event.head_commit.message != 'Remove bottom feature strip'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove bottom feature strip
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove feature-strip CSS blocks safely.
          for marker in [
              '.feature-grid{',
              '.feature{',
              '.feature .ico{',
              '.feature b{',
              '.feature span{',
          ]:
              while marker in s:
                  start = s.find(marker)
                  end = s.find('}', start)
                  if end == -1:
                      break
                  s = s[:start] + s[end + 1:]

          # Remove everything from the bottom feature strip to the modal,
          # while preserving the app's closing </div>.
          start_marker = '<div class="feature-grid">'
          end_marker = '<div class="modal-backdrop"'
          if start_marker in s and end_marker in s:
              start = s.index(start_marker)
              end = s.index(end_marker, start)
              s = s[:start] + '</div>\n' + s[end:]

          p.write_text(s, encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove bottom feature strip"
          git push
