name: Fix board render flicker

on:
  push:
    paths:
      - '.github/workflows/fix-render-flicker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timer rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = "function stopClock(){if(timerId){clearInterval(timerId);timerId=null}}"
          helper = "function updateClocks(){wtEl.textContent=fmt(time.w);btEl.textContent=fmt(time.b);wcEl.querySelector('.clock').classList.toggle('red',time.w<=30&&time.w>0);bcEl.querySelector('.clock').classList.toggle('red',time.b<=30&&time.b>0)}"
          if helper not in s:
              s = s.replace(marker, marker + helper)

          old = "time[turn]=Math.max(0,time[turn]-e);if(time[turn]===0){gameOver=true;stopClock();sound('end');showWinner(turn==='w'?'Black':'White','Time Out')}render()"
          new = "time[turn]=Math.max(0,time[turn]-e);if(time[turn]===0){gameOver=true;stopClock();sound('end');showWinner(turn==='w'?'Black':'White','Time Out')}updateClocks()"
          if old not in s:
              raise SystemExit('Expected timer render pattern was not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix board flicker during timer updates' || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-render-flicker.yml
          git add -u .github/workflows/fix-render-flicker.yml
          git commit -m 'Remove temporary render fix workflow' || exit 0
          git push
